name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Prepare Android SDK
        run: |
          SDKM=$(command -v sdkmanager || true)
          [ -z "$SDKM" ] && SDKM=$(ls ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          echo "sdkmanager = $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          fi
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: bash build.sh
      - run: cd proj && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: nakpon-apk, path: proj/app/build/outputs/apk/debug/app-debug.apk }
