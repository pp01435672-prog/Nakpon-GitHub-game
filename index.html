<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}html,body{margin:0;height:100%}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>นากปอน กรีดยางผี</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one 16:9 night stage. Canvas draws the world (hut, board, rubber plantation); DOM paper panels (receipt, ghost book, shop) sit on top. */
:root{
  --ink:#070b18; --night:#0e1631; --paper:#f3ecd9; --paper-2:#e2d6b8; --cyan:#00ffdc; --olive:#515a45;
  --blood:#e2514f; --lamp:#ffb347; --stam:#b9e65c; --ear:#a78bff; --wood:#6b4a2f; --line:#10131c;
  --font-d:'Itim','Sarabun',system-ui,sans-serif; --font-b:'Sarabun','Itim',system-ui,sans-serif;
  color-scheme: dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;box-sizing:border-box;background:var(--ink);color:var(--paper);font-family:var(--font-b);display:flex;align-items:center;justify-content:center;padding-block:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:relative;aspect-ratio:16/9;width:min(100%,calc((100vh - 10px) * 16 / 9));width:min(100%,calc((100dvh - 10px) * 16 / 9));max-height:100%;container-type:size;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #1d2540}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;font-size:clamp(10px,1.9cqw,24px)}
#ui>*{pointer-events:auto}
button{font-family:var(--font-d);color:var(--line);cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.hot{position:absolute;transform:translate(-50%,-50%);background:var(--paper);border:2px solid var(--line);border-radius:3px;padding:.35em .9em;font-size:1.15em;box-shadow:.3cqw .45cqw 0 rgba(0,0,0,.55);white-space:nowrap;transition:transform .12s}
.hot:hover{transform:translate(-50%,-52%) rotate(-1.5deg)}
.hot.pulse{animation:pulse .7s ease-in-out infinite alternate;background:#ffe27a}
@keyframes pulse{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.12) rotate(-2deg)}}
.sign-hit{position:absolute;left:13.5%;top:11%;width:31.2%;height:72%;background:transparent;border:0;border-radius:6px}.sign-hit.b{left:55.2%}
.sign-hit:hover{background:rgba(255,226,122,.08)}
.money{position:absolute;right:2%;top:3%;background:var(--paper);color:var(--line);border:2px solid var(--line);padding:.2em .8em;font-family:var(--font-d);font-size:1.3em;box-shadow:.25cqw .35cqw 0 rgba(0,0,0,.5)}
.mute{position:absolute;left:1.5%;top:3%;background:rgba(243,236,217,.85);border:2px solid var(--line);padding:.15em .6em;font-size:1em;border-radius:3px}
.mute[aria-pressed="true"]{text-decoration:line-through;opacity:.7}
.bill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1.2deg);width:36cqw;max-height:92cqh;overflow:auto;background:var(--paper);color:var(--line);padding:1.6em 1.8em 1.4em;box-shadow:.5cqw .7cqw 0 rgba(0,0,0,.6);font-family:var(--font-b);animation:drop .35s ease-out}
.bill::after{content:"";position:absolute;left:0;right:0;bottom:-.6em;height:.7em;background:linear-gradient(-45deg,transparent .45em,var(--paper) 0),linear-gradient(45deg,transparent .45em,var(--paper) 0);background-size:.9em .9em}
@keyframes drop{from{transform:translate(-50%,-90%) rotate(4deg);opacity:0}to{transform:translate(-50%,-50%) rotate(-1.2deg);opacity:1}}
.rc-head{font-family:var(--font-d);font-size:1.7em;text-align:center;border-bottom:2px dashed var(--line);padding-bottom:.3em}
.rc-sub{text-align:center;font-size:.8em;opacity:.7;margin:.3em 0 .6em}
.bill dl{display:grid;grid-template-columns:auto 1fr;gap:.2em 1em;margin:0 0 .6em}
.bill dt{font-weight:700}.bill dd{margin:0;text-align:right}
.rc-story{font-size:1em;line-height:1.5;border-top:2px dashed var(--line);border-bottom:2px dashed var(--line);padding:.6em 0;margin:.4em 0}
.rc-total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-d);font-size:1.6em;margin:.4em 0 .8em}
.rc-btns{display:flex;gap:.8em}
.rc-btns button{flex:1;padding:.5em;font-size:1.25em;border:2px solid var(--line);border-radius:3px;background:var(--paper-2);box-shadow:.2cqw .3cqw 0 rgba(0,0,0,.45)}
.rc-btns button.go{background:#9be37a}
.rc-btns button:hover{transform:translateY(-2px)}
.panel{position:absolute;inset:4% 6%;background:var(--paper);color:var(--line);border:3px solid var(--line);box-shadow:.6cqw .8cqw 0 rgba(0,0,0,.6);display:grid;grid-template-columns:30% 1fr;overflow:hidden;animation:drop2 .25s ease-out}
@keyframes drop2{from{transform:translateY(6%);opacity:0}to{transform:none;opacity:1}}
.panel .x{position:absolute;right:.6em;top:.5em;font-size:1.1em;padding:.2em .8em;background:var(--blood);color:#fff;border:2px solid var(--line);border-radius:3px;z-index:2}
.bk-list{background:var(--paper-2);border-right:3px solid var(--line);overflow:auto;padding:.5em;display:flex;flex-direction:column;gap:.4em}
.bk-list button{display:flex;align-items:center;gap:.6em;text-align:left;padding:.3em .5em;background:var(--paper);border:2px solid var(--line);border-radius:3px;font-size:1em}
.bk-list button[aria-current="true"]{background:#ffe27a;transform:rotate(-1deg)}
.bk-list canvas{width:3.6em;height:3.6em;background:#1b2340;border:2px solid var(--line);flex:none}
.bk-detail{padding:1.1em 1.4em;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 28%;gap:1em;align-content:start}
.bk-detail h2{grid-column:1/-1;margin:0;font-family:var(--font-d);font-size:1.9em;padding-right:4em}
.bk-detail .txt{min-width:0;line-height:1.5}
.bk-detail h3{margin:.6em 0 .1em;font-size:.95em;letter-spacing:.04em;color:#8a2f2f}
.bk-detail p,.bk-detail li{margin:0;font-size:.98em}
.bk-detail ul{margin:0;padding-left:1.2em}
.bk-art{width:100%;aspect-ratio:3/4;background:linear-gradient(#10183a,#1d2c55);border:3px solid var(--line);align-self:start}
.shop-art{width:100%;aspect-ratio:3/4;background:linear-gradient(#2b1d3d,#583a2a);border-right:3px solid var(--line)}
.shop-main{padding:1em 1.3em;display:flex;flex-direction:column;gap:.7em;overflow:auto}
.shop-main h2{margin:0;font-family:var(--font-d);font-size:1.7em;padding-right:4em}
.shop-say{background:#fff;border:2px solid var(--line);border-radius:10px;padding:.5em .8em;font-family:var(--font-d);font-size:1.1em;position:relative}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:.9em;align-items:center;background:var(--paper-2);border:2px solid var(--line);padding:.6em .8em;border-radius:3px}
.item svg{width:3.4em;height:3.4em}
.item b{font-family:var(--font-d);font-size:1.15em}
.item small{display:block;line-height:1.4;font-size:.85em;opacity:.85}
.item button{padding:.4em .9em;font-size:1.05em;background:#9be37a;border:2px solid var(--line);border-radius:3px}
.item button:disabled{background:#b9b3a0;cursor:not-allowed;opacity:.7}
.wallet{font-family:var(--font-d);font-size:1.15em}
#drawer{grid-template-columns:26% 1fr}
.stabs{display:flex;gap:.5em}.stabs button{padding:.35em 1.2em;font-size:1.05em;background:var(--paper-2);border:2px solid var(--line);border-radius:3px 3px 0 0}.stabs button.on{background:#ffe27a;font-weight:700}.item.eq{outline:3px solid #ffb400}.item button.on{background:#e2a07a}
#cls-monk{background:#ff8c00}#monkp{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);background:#2a1a0a;color:#f6e7c4}.mkw{padding:1.2em 1.6em;overflow:auto}.mkh{margin:0 0 .6em;font-family:var(--font-d);font-size:1.8em;color:#ffb347}.mkg{display:grid;grid-template-columns:1fr 1fr;gap:.8em}.mk{display:grid;grid-template-columns:3.2em 1fr;gap:.2em .8em;align-items:center;text-align:left;padding:.7em .9em;background:#ff8c00;color:#07080c;border:3px solid #07080c;border-radius:4px;position:relative}.mk i{grid-row:span 2}.mk i svg{width:100%;height:auto}.mk b{font-family:var(--font-d);font-size:1.15em}.mk small{font-size:.82em;line-height:1.3}.mk em{position:absolute;right:.6em;top:.4em;font-style:normal;font-weight:700}.mk:disabled{background:#6a5a44;color:#bba;cursor:not-allowed}
.hot.tab{width:6cqw;height:14cqh;padding:.3em;border-radius:0 10px 10px 0;transform:translate(0,-50%)}.hot.tab:hover{transform:translate(0,-50%)}
.tpl{display:grid!important;grid-template-columns:1fr 1fr;gap:.5em;align-content:start}
.tpl .tp{display:flex;flex-direction:column;align-items:center;gap:.1em;padding:.4em .2em;text-align:center}
.tpl .tp i svg{width:2.6em;height:2.6em;display:block}.tpl .tp span{font-size:.85em}
.tic{display:flex;gap:.3em;margin-top:.3em}.tic i svg{width:1.9em;height:1.9em;display:block}
.bk-list .tp{display:block;text-align:left}.bk-list .tp small{display:block;font-size:.78em;line-height:1.35;opacity:.85}
.bk-list .tp.on{background:#9be37a;transform:rotate(-.6deg)}
.dgl{display:flex;flex-direction:column;gap:.5em}
.dg{display:grid;grid-template-columns:5em minmax(0,1fr) auto;gap:.7em;align-items:center;background:var(--paper-2);border:2px solid var(--line);padding:.4em .6em;border-radius:3px}
.dg canvas{width:5em;height:5em;background:#1b2340;border:2px solid var(--line)}
.dg.fit{background:#ffe9a0}.dg.sel{outline:3px solid #2a8a4a}
.dg .ln,.bk-detail .ln{font-size:.85em;opacity:.85;line-height:1.4;margin:.1em 0}
.chips{display:flex;flex-wrap:wrap;gap:.3em}.chips span{background:var(--paper);border:1.5px solid var(--line);border-radius:99px;padding:0 .6em;font-size:.8em}
.dg button{padding:.4em .8em;font-size:1em;background:#9be37a;border:2px solid var(--line);border-radius:3px}
#drawer.one{grid-template-columns:1fr}
#drawer,#bagp{grid-template-rows:minmax(0,1fr)}
.bi5 svg{width:3.6em!important;height:3.6em!important}.sbig{margin-bottom:.4em}
.bk-detail.san{gap:.2em;padding-top:3em}.srow{margin-top:.15em;padding:.2em .6em}.srow i svg{width:2em;height:2em}.spct{font-size:1.4em}.sbig{gap:.2em}.sbar{height:1em}
.ribs{position:absolute;top:0;right:6.2em;display:flex;gap:.55em;z-index:3}
.rib{width:2.9em;height:3.6em;padding:.4em .5em 1.1em;border:0;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);transition:height .15s}
.rib i svg{width:100%;height:100%;display:block}
.rib.ev{background:#e8b83a}.rib.lore{background:#c0392b}.rib.san{background:#2e6fd0}
.rib.cur{height:4.4em;filter:brightness(1.12)}
.bk-detail.pg{padding-top:3.6em}
#drawer:not(.one) .bk-detail,#drawer:not(.one) .bk-list{padding-top:3.6em}
.dg.lore{grid-template-columns:5em minmax(0,1fr);align-items:start}
.dg.lore .lt{min-width:0}.dg.lore u{font-weight:700;text-decoration:none;color:#8a2f2f;margin-right:.3em}
.sbig{display:flex;flex-direction:column;align-items:center;gap:.4em;margin-bottom:.8em}
.bi5 svg{width:5em;height:5em;display:block}
.sbar{width:70%;height:1.2em;border:2px solid var(--line);border-radius:99px;background:var(--paper-2);overflow:hidden}
.sfill{height:100%;background:#4a8cf0;transition:width .3s}.sfill.bad{background:#c0392b}
.spct{font-size:1.8em;font-family:var(--font-d)}.sst{margin:0;font-size:1.05em}.sst.bad{color:#b02020;font-weight:700}
.srow{display:grid;grid-template-columns:3em 2.2em minmax(0,1fr);gap:.6em;align-items:center;background:var(--paper-2);border:2px solid var(--line);border-radius:3px;padding:.4em .7em;margin-top:.4em}
.srow i svg{width:2.6em;height:2.6em;display:block}.srow p{margin:0}.srow .dn{color:#b02020}.srow .up{color:#2a8a4a}
#bagp{grid-template-columns:1fr 1fr;background:linear-gradient(90deg,var(--paper) 0,var(--paper) 49.3%,#a99b78 50%,var(--paper) 50.7%,var(--paper) 100%)}
.bgl,.bgr{padding:1.2em 1.5em;overflow:auto;min-width:0}
.bgh{display:flex;align-items:center;gap:.4em;margin:0 0 .6em;font-family:var(--font-d);font-size:1.5em}.bgh i svg{width:1.4em;height:1.4em;display:block}
.sls{display:flex;gap:.7em;justify-content:center;margin-top:1.2em;flex-wrap:wrap}
.sl{position:relative;width:6.2em;height:6.2em;border:3px dashed var(--line);border-radius:10px;background:var(--paper-2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.sl.f{border-style:solid}.sl.cur{background:#ffe27a}.sl.hv,.sls.arm .sl{outline:3px solid #2a8a4a;background:#e6f5c8}
.sl em{position:absolute;left:.3em;top:.1em;font-style:normal;font-size:.8em;opacity:.6}.sl .pl{font-size:2em;opacity:.3}
.sl canvas,.bi canvas{width:3.8em;height:3.8em;pointer-events:none}
.sl small,.bi small{font-size:.8em;pointer-events:none}
.hint{font-size:.9em;opacity:.8;line-height:1.5;margin-top:1.2em;text-align:center}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em}
.bi{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:var(--paper-2);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;cursor:grab;user-select:none}
.bi.sel{background:#ffe27a;outline:3px solid #2a8a4a}
.dragic{position:fixed;z-index:99;pointer-events:none;width:64px;height:64px;transform:translate(-50%,-50%);opacity:.92}
.mt{grid-column:1/-1;opacity:.7}
#splash{position:absolute;inset:0;display:grid;place-content:center;gap:.8em;text-align:center;background:rgba(5,8,20,.72)}
#splash h1{margin:0;font-family:var(--font-d);font-weight:400;font-size:4.6em;line-height:1.05;color:var(--cyan);text-shadow:.06em .06em 0 #000,-.03em -.03em 0 #000,0 0 .5em rgba(0,255,220,.35);transform:rotate(-2deg)}
#splash p{margin:0;font-size:1.05em;opacity:.9;line-height:1.6}
#splash button{justify-self:center;font-size:1.6em;padding:.35em 1.4em;background:var(--paper);border:3px solid var(--line);border-radius:3px;box-shadow:.3cqw .45cqw 0 rgba(0,0,0,.6);animation:pulse2 .9s ease-in-out infinite alternate}
@keyframes pulse2{to{transform:scale(1.07) rotate(-1deg)}}
#rotate{display:none}
@media (orientation:portrait){
  #rotate{position:fixed;inset:0;z-index:50;display:grid;place-content:center;gap:.5em;text-align:center;background:var(--ink);font-family:var(--font-d);font-size:6vw;padding:16px}
  #rotate small{font-size:3.6vw;font-family:var(--font-b);opacity:.8}
}
@media (prefers-reduced-motion:reduce){.hot.pulse,#splash button{animation:none}.bill,.panel{animation:none}}
.dghelp{margin:0 0 .5em;font-size:.88em;line-height:1.4;background:#fff4c8;border:2px solid var(--line);padding:.4em .7em;border-radius:3px}.tic{flex-wrap:wrap}.tic i{display:flex;align-items:center;gap:.2em;background:#e8e0c4;border:1.5px solid var(--line);border-radius:3px;padding:.1em .45em .1em .15em;font-style:normal}.tic i svg{width:1.5em;height:1.5em}.tic i b{font-size:.8em;font-weight:400}.tpl .tp em{font-style:normal;font-size:.66em;line-height:1.25;opacity:.85}
#fs{font-size:1.1em!important;animation:none!important;background:#cfe9ff!important}
</style>

<style>#fs{display:none!important}</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="ui">
    <button class="hot pulse" id="h-phone" hidden>รับสาย</button>
    <button class="hot" id="h-book" hidden>หนังสือผีไทย</button>
    <button class="hot" id="h-shop" hidden>ร้านบีเวอร์นักปราบผี</button>
    <button class="hot" id="h-back" hidden>กลับเถียงนา</button>
    <button class="sign-hit" id="h-board" hidden aria-label="เลือกปังปอนด์เจ้านากทะเลเพื่อออกกรีดยาง"></button>
    <button class="sign-hit b" id="h-board2" hidden aria-label="เลือกเสียงซอเจ้านกนางแอ่นเพื่อออกกรีดยาง"></button>
    <div class="money" id="money" hidden>฿ 0</div>
    <button class="mute" id="mute" aria-pressed="false" hidden>เสียง</button>
    <section class="bill" id="bill" hidden></section>
    <section class="panel" id="book" hidden></section>
    <section class="panel" id="shop" hidden></section>
    <button class="hot tab" id="h-drawer" hidden aria-label="เปิดสมุดผี"><svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M8 4l9 8-9 8" fill="none" stroke="#07080c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <section class="panel" id="drawer" hidden></section>
    <section class="panel" id="bagp" hidden></section>
    <button class="hot tab" id="cls-monk" hidden aria-label="พระไตรปิฎก"><svg viewBox="0 0 24 24" width="100%" height="100%"><rect x="4" y="5" width="16" height="14" rx="1.5" fill="#fff4d6" stroke="#07080c" stroke-width="2"/><path d="M8 9h8M8 12h8M8 15h5" stroke="#07080c" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <section class="panel" id="monkp" hidden></section>
    <section class="bill" id="result" hidden></section>
    <div id="splash">
      <h1>ปังปอนด์<br>กรีดยางผี</h1>
      <p>รับสาย รับงาน กรีดยางตอนกลางคืน แล้วกลับเถียงนา<br>ลากจอยซ้ายเพื่อเดิน แตะที่ไหนก็ได้เพื่อโยนหินล่อผี</p>
      <button id="start">แตะเพื่อเริ่ม</button>
      <button id="fs">⛶ เต็มหน้าจอ</button>
    </div>
  </div>
</div>
<div id="rotate">หมุนจอเป็นแนวนอน<small>เกมนี้เล่นในแนวนอนเท่านั้น</small></div>

<script>
(()=>{
'use strict';
const W=960,H=540;let WW=2400,WH=800,YB=765;
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
const dk=document.createElement('canvas'),dctx=dk.getContext('2d');
let K=1;
const rnd=(a,b)=>a+Math.random()*(b-a),rndi=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),sgn=v=>v<0?-1:1;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const INK='#07080c',FONT='Itim, Sarabun, sans-serif';

function resize(){const r=stage.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);K=Math.max(.5,r.width/W*dpr);cv.width=Math.round(W*K);cv.height=Math.round(H*K);dk.width=cv.width;dk.height=cv.height;}
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
resize();

/* ============ AUDIO (8-bit) ============ */
let AC=null,master=null;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);}catch(e){AC=null;}
  if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,v,f2,delay){if(!AC||S.muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);}
function hiss(d,v,fq){if(!AC||S.muted)return;const n=Math.max(1,AC.sampleRate*d|0);const b=AC.createBuffer(1,n,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||1200;const g=AC.createGain();g.gain.value=v||.1;s.connect(f);f.connect(g);g.connect(master);s.start();}

const SIZES=[{n:'กลาง',len:2600,w:35},{n:'ใหญ่',len:5000,w:30},{n:'ใหญ่มาก',len:9000,w:22},{n:'ยาวเป็นกิโล',len:16000,w:13}];

function wpick(arr){let r=Math.random()*arr.reduce((a,b)=>a+b.w,0),i=0;for(;i<arr.length;i++){r-=arr[i].w;if(r<=0)break;}return arr[Math.min(i,arr.length-1)];}
function makeHuntJob(){
  const owner=pick(OWNERS),kind=pick(['house','house','hotel','dorm']);
  const rooms=kind==='house'?{living:rndi(0,1),bed:rndi(1,3),bath:rndi(1,2)}:kind==='hotel'?{living:rndi(0,1),bed:rndi(1,2),bath:1}:{living:0,bed:1,bath:1};
  const pay=pick([700,900,1200,1500,1900]);
  const place=kind==='house'?pick(['บ้านเก่าท้ายซอย','บ้านไม้ริมคลอง','บ้านสองชั้นหลังวัด']):kind==='hotel'?pick(['โรงแรมริมถนนใหญ่','โรงแรมเก่ากลางเมือง']):pick(['หอพักนักศึกษา','หอพักชั้นสาม']);
  return{mode:'hunt',owner,pay,kind,rooms,ghost:pick(Object.keys(HG)),place,hints:[]};
}
function makeJob(){
  const fh=location.hash||'';
  if(/wake/.test(fh))return makeWakeJob(fh);
  if(!/square|tap|hunt/.test(fh)&&Math.random()<.2)return makeWakeJob(fh);
  if(fh.includes('hunt')){const j=makeHuntJob();const m=fh.match(/gh-(\w+)/);if(m&&HG[m[1]])j.ghost=m[1];return j;}
  if(!/square|tap/.test(fh)&&Math.random()<.25)return makeHuntJob();
  const big=Math.random()<.45;
  const pay=big?pick([1200,1500,1800,2200,2800,3500]):pick([350,480,590,690,780,890,950]);
  const sq=fh.includes('square')||Math.random()<.2;
  let len,dep,n,si;
  if(sq){const q=pick(SQUARES);len=dep=q.s;n=q.n;si=q.s>=4000?3:q.s>=3000?2:1;}
  else{const s=wpick(SIZES);si=SIZES.indexOf(s);len=s.len;dep=wpick(DEPTHS).d;n=s.n;}
  const hill=Math.random()<.5;
  const trees=Math.min(14,4+Math.floor(pay/700)+si+Math.floor(len*dep/4e6));
  const nG=rndi(2,3)+(pay>=1000?1:0)+(len*dep>1.2e7?1:0);
  const pool=hill?['pop','monk','kuman','pop4','mimic','krahang']:['kras','preta','pop','monk','kuman','pop4','mimic','krahang'];
  const ghosts=shuffle(pool).slice(0,nG);while(ghosts.length<nG)ghosts.push(pick(pool));{const fg=(fh.match(/ng-(\w+)/)||[])[1];if(fg)ghosts.splice(0,ghosts.length,fg);}
  const SPK=/spook/.test(location.hash);const khian=SPK||Math.random()<.35,tani=SPK||Math.random()<.35;
  const hints=shuffle(Array.from(new Set(ghosts))).slice(0,2).map(g=>HINTS[g]);if(khian)hints[hints.length>1?1:1]=HINTS.khian;if(tani)hints[0]=HINTS.tani;
  return{mode:'tap',owner:pick(OWNERS),pay,trees,ghosts,hill,size:{n,m:`${len/20}×${dep/20} ม.`},len,dep,sq,hints,khian,tani};
}

function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
  initAudio();e.preventDefault();const p=toL(e);S.ptr=p;

function joyMove(x,y){let dx=x-JOY.x,dy=y-JOY.y;const m=Math.hypot(dx,dy);if(m>JOY.r){dx=dx/m*JOY.r;dy=dy/m*JOY.r;}In.joy.x=dx/JOY.r;In.joy.y=dy/JOY.r;}
window.addEventListener('keydown',e=>{
  initAudio();const k=e.key.toLowerCase();In.keys[k]=true;
  if(S.mode==='play'&&S.panel==='bag'&&(k==='b'||k==='g'||k==='escape')){closeBag();return;}
  if(S.mode==='play'&&S.panel==='monk'&&(k==='escape'||k==='m')){S.panel=null;syncUI();return;}
  if(S.mode!=='play'||S.panel)return;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(e.repeat)return;
  const R=S.run;if(!R||R.over)return;
  if(R.grab){if(k===' '||k==='e'||k==='enter')grabTap();return;}
  if(k==='e'||k===' ')interact();
  if(k==='q')clsPress();if(k==='m')openMonk();
  else if(k==='q'){if(!R.hunt)trySlide();}
  else if(k==='f'){if(R.hunt)huntUse();}
  else if(k==='g'||k==='b'){if(R.hunt)openBag();}
  else if(k==='c')toggleCrouch();
  else if(k>='1'&&k<='8')keyNum(+k);
  else if(k==='escape'&&R.mg)cancelMG('ยกเลิกแล้ว');
});

function getMove(){
  let x=In.joy.x,y=In.joy.y;const k=In.keys;
  if(k.a||k.arrowleft)x-=1;if(k.d||k.arrowright)x+=1;if(k.w||k.arrowup)y-=1;if(k.s||k.arrowdown)y+=1;
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}return{x,y,m:Math.min(1,m)};
}

let bookIdx=0;
function openBook(i){
  bookIdx=i;const b=BOOK[i];
  $('book').innerHTML=`<button class="x" id="bk-x">ปิด</button><div class="bk-list">${BOOK.map((g,n)=>`<button data-i="${n}" aria-current="${n===i}"><canvas width="96" height="96" data-k="${g.k}"></canvas><span>${g.name}</span></button>`).join('')}</div>
  <div class="bk-detail"><h2>${b.name}</h2><div class="txt"><h3>ลักษณะ</h3><p>${b.look}</p><h3>นิสัย</h3><p>${b.habit}</p><h3>อันตราย</h3><p>${b.danger}</p><h3>วิธีรับมือ</h3><ul>${b.tips.map(t=>`<li>${t}</li>`).join('')}</ul></div><canvas class="bk-art" id="bk-art" width="240" height="320"></canvas></div>`;
  $('book').querySelectorAll('.bk-list canvas').forEach(c=>drawGhostThumb(c,c.dataset.k,0));
}
$('book').addEventListener('click',e=>{
  if(e.target.id==='bk-x'){S.panel=null;syncUI();return;}
  const b=e.target.closest('button[data-i]');if(b)openBook(+b.dataset.i);
});
function drawGhostThumb(c,k,t){
  const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  const sc={kras:.55,preta:.34,pop:.7,monk:.6,kuman:.95,khian:.6,tani:.6,pop4:1.2,mimic:.85,krahang:.8}[k];
  g.save();g.translate(c.width/2,c.height-8);g.scale(sc,sc);g.translate(-0,0);
  drawGhostByType(g,k,0,0,t,{low:k==='preta'?.8:0,face:1,thumb:true});g.restore();
}
function drawBookArt(t){
  const c=$('bk-art');if(!c)return;const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(c.width/2,c.height-30,70,12,0,0,7);g.fill();
  const k=BOOK[bookIdx].k;const sc={kras:1.15,preta:.78,pop:1.6,monk:1.4,kuman:2.2,khian:1.5,tani:1.5,pop4:2.7,mimic:1.9,krahang:1.6}[k];
  g.save();g.translate(c.width/2,c.height-34);g.scale(sc,sc);
  drawGhostByType(g,k,0,0,t,{low:k==='preta'?.75:0,face:1,thumb:true});g.restore();
}

function drawBeaver(t){
  const c=$('sh-art');if(!c)return;const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  t=t||0;g.save();g.translate(120,290);g.lineWidth=4;g.strokeStyle=INK;g.lineJoin='round';
  // tail
  g.fillStyle='#4a3022';g.beginPath();g.ellipse(70,-10,46,22,-.5,0,7);g.fill();g.stroke();
  g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(40+i*8,-22+i*3);g.lineTo(52+i*8,2+i*3);g.stroke();}
  g.strokeStyle=INK;g.lineWidth=4;
  // body
  g.fillStyle='#8a5a36';g.beginPath();g.moveTo(-52,0);g.lineTo(-44,-120);g.lineTo(44,-120);g.lineTo(52,0);g.closePath();g.fill();g.stroke();
  g.fillStyle='#d9b585';g.beginPath();g.ellipse(0,-62,30,50,0,0,7);g.fill();g.stroke();
  // belt + talismans
  g.fillStyle='#b72b2b';g.fillRect(-50,-60,100,10);g.strokeRect(-50,-60,100,10);
  g.fillStyle='#f3e18a';[-34,28].forEach(x=>{g.fillRect(x,-50,14,28);g.strokeRect(x,-50,14,28);});
  // head
  g.fillStyle='#8a5a36';g.beginPath();g.ellipse(0,-150,58,50,0,0,7);g.fill();g.stroke();
  g.beginPath();g.arc(-40,-190,14,0,7);g.arc(40,-190,14,0,7);g.fill();g.stroke();
  g.fillStyle='#d9b585';g.beginPath();g.ellipse(0,-136,32,24,0,0,7);g.fill();g.stroke();
  // eyes
  g.fillStyle='#fff';[-22,22].forEach(x=>{g.beginPath();g.ellipse(x,-160,12,14,0,0,7);g.fill();g.stroke();});
  g.fillStyle=INK;[-22,22].forEach(x=>{g.beginPath();g.ellipse(x+Math.sin(t)*2,-158,4,6,0,0,7);g.fill();});
  // nose + teeth
  g.fillStyle=INK;g.beginPath();g.ellipse(0,-142,9,6,0,0,7);g.fill();
  g.fillStyle='#fff';g.fillRect(-9,-136,8,16);g.fillRect(1,-136,8,16);g.strokeRect(-9,-136,8,16);g.strokeRect(1,-136,8,16);
  // headband with talisman
  g.fillStyle='#b72b2b';g.fillRect(-58,-186,116,12);g.strokeRect(-58,-186,116,12);
  g.fillStyle='#f3e18a';g.fillRect(-9,-178,18,30);g.strokeRect(-9,-178,18,30);
  g.fillStyle='#a02a2a';g.fillRect(-4,-172,8,4);g.fillRect(-4,-164,8,4);
  g.restore();
}

/* ============ DRAWING HELPERS ============ */

    if(g.state==='idle'){if(g.cool<=0&&p.inv<=0&&(d<sight||hears(g)))startCharge(g,p.x,p.y);}
    else if(g.state==='charge'){
      const dd=moveToward(g,g.cx,g.cy,330,dt);
      if(Math.hypot(g.x-p.x,g.y-p.y)<34&&p.inv<=0&&!R.grab&&p.frozen<=0&&!hidP(p)){p.hp-=20;p.frozen=5;p.inv=5.5;p.slideT=0;R.mg=null;p.hurt=.6;g.state='return';g.cool=7;sfx.bite();say('ฮึก...',2);if(p.hp<=0)die('ปอบหน้าลิง');}
      else if(dd<8){g.state='tired';g.tt=2.2;}
    }
    else if(g.state==='tired'){g.tt-=dt;if(g.tt<=0)g.state='return';}
    else if(g.state==='return'){const dd=moveToward(g,g.home.x,g.home.y,110,dt);if(dd<6)g.state='idle';}
  }else if(T==='monk'){
    g.cool-=dt;
    if(g.state==='wander'){wander(g,dt,50);if(g.cool<=0&&p.inv<=0&&d<sight){g.state='call';g.grace=.8;g.cr=0;sfx.call();R.callWarn=3;toast('มันเรียก! กดปุ่มย่อง แล้วนิ่งไว้',3);}}
    else if(g.state==='investigate'){const dd=moveToward(g,g.tx,g.ty,60,dt);g.it-=dt;if(dd<10||g.it<=0){g.state='wander';g.wt=0;}if(g.cool<=0&&p.inv<=0&&d<sight){g.state='call';g.grace=.8;g.cr=0;sfx.call();R.callWarn=3;}}
    else if(g.state==='call'){
      g.face=sgn(p.x-g.x);g.grace-=dt;
      if(p.crouch)g.cr+=dt;else if(g.grace<=0){p.hp-=30*dt;p.hurt=.15;if(p.hp<=0)die('ผีพระ/ชีเรียก');}
      if(g.cr>=2.5){g.state='leave';g.lv=3.5;g.cool=10;const a=Math.random()*6.28;g.tx=clamp(g.x+Math.cos(a)*300,60,WW-60);g.ty=clamp(g.y+Math.sin(a)*150,230,YB-15);}
      else if(d>520){g.state='wander';g.cool=6;}
    }
    else if(g.state==='leave'){moveToward(g,g.tx,g.ty,70,dt);g.lv-=dt;if(g.lv<=0){g.state='wander';g.wt=0;}}
  }else if(T==='preta'){
    g.wh-=dt;if(g.wh<=0){g.wh=5;sfx.whistle();R.ripples.push({x:g.x,y:g.y,r:0,max:340,col:'170,200,255'});}
    if(g.state==='wander'){g.low=Math.max(0,g.low-dt*1.5);wander(g,dt,60);if(d<460&&hears(g)){g.state='stare';g.far=0;}}
    else if(g.state==='investigate'){g.low=Math.max(0,g.low-dt*1.5);const dd=moveToward(g,g.tx,g.ty,80,dt);g.it-=dt;if(dd<10||g.it<=0){g.state='wander';g.wt=0;}if(d<460&&hears(g)){g.state='stare';g.far=0;}}
    else if(g.state==='stare'){
      if(d>70)moveToward(g,p.x,p.y,70,dt);g.low=Math.min(1,g.low+dt*1.3);g.face=sgn(p.x-g.x);
      if(d<170&&g.low>.5)p.slow=3;
      if(d>240){g.far+=dt;if(g.far>2)g.state='wander';}else g.far=0;
    }
  }else if(T==='kuman'){
    if(g.state==='wander'){wander(g,dt,70);if(d<sight||hears(g))g.state='chase';}
    else if(g.state==='investigate'){const dd=moveToward(g,g.tx,g.ty,110,dt);g.it-=dt;if(dd<10||g.it<=0){g.state='wander';g.wt=0;}if(d<sight||hears(g))g.state='chase';}
    else if(g.state==='chase'){moveToward(g,p.x,p.y,200,dt);if(d<70)g.state='pester';}
    else if(g.state==='pester'){
      {const nx=g.x+(p.x+Math.cos(g.t*3)*55-g.x)*Math.min(1,dt*5),ny=g.y+(p.y+Math.sin(g.t*2.3)*22-g.y)*Math.min(1,dt*5);if(!fenceBlock(g.x,g.y,nx,ny)){g.x=nx;g.y=ny;}}g.face=sgn(p.x-g.x);
      R.noise.extra=Math.max(R.noise.extra,.65);g.chat-=dt;if(g.chat<=0){sfx.chatter();g.chat=.55;}
      if(d>320)g.state='chase';
    }
    else if(g.state==='laugh'){g.lt-=dt;if(g.lt<=0){g.gone=30;g.state='wander';say('ฮ่าๆ เล่นกับกุมารก็สนุกดีนะ',2.2);}}
  }else if(T==='pop4')updPop4(g,dt,d,sight);else if(T==='mimic')updMimic(g,dt,d);else if(T==='krahang')updKrahang(g,dt,d);
}

function updatePlay(dt){if(S.run.hunt)return updHunt(dt);if(S.run.wake)return updWake(dt);
  const R=S.run,p=R.p;R.t+=dt;updClass(dt);
  if(R.toast){R.toast.t-=dt;if(R.toast.t<=0)R.toast=null;}
  for(const k of['stoneCd','inv','frozen','slow','hurt','happy','fell','bang']){if(p[k]>0)p[k]=Math.max(0,p[k]-dt);}
  if(p.slideT>0){p.slideT-=dt;if(p.slideT<=0){p.slideT=0;p.slideCd=10;}}else if(p.slideCd>0)p.slideCd=Math.max(0,p.slideCd-dt);
  if(p.bounce>0)p.bounce=Math.max(0,p.bounce-dt);if(!p.fly&&p.flyCd>0)p.flyCd=Math.max(0,p.flyCd-dt);
  R.noise.extra=Math.max(0,R.noise.extra-dt*2);
  if(R.over){R.overT-=dt;if(R.overT<=0&&!R.shown){R.shown=true;fadeTo(()=>showResult());}
    for(const f of R.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=380*dt;}R.fx=R.fx.filter(f=>f.t<f.life);return;}
  updPQ(dt);updCarry(dt);
  // grab
  if(R.grab){
    const gr=R.grab;gr.t-=dt;p.lift=Math.min(46,p.lift+dt*220);
    if(gr.taps>=5){gr.g.stun=2.2;gr.g.state='wander';p.inv=2.5;p.x+=sgn(p.x-gr.g.x)*80;R.grab=null;say('แฮ่ก... รอดแล้ว!',2);sfx.good();}
    else if(gr.t<=0){R.grab=null;die('กระสือ');}
  }else if(R.carry)p.lift+=((R.carry.g.hz||150)-112-p.lift)*Math.min(1,dt*3);
  else if(p.slideDown>0){p.slideDown-=dt;p.lift=Math.max(0,p.lift-dt*70);if(p.slideDown<=0){p.slideDown=0;p.lift=0;}}
  else p.lift=Math.max(0,p.lift-dt*300);
  // minigame
  if(R.mg){
    const m=R.mg;m.pos+=m.dir*m.sp*dt;if(m.pos>=1){m.pos=1;m.dir=-1;}if(m.pos<=0){m.pos=0;m.dir=1;}
    m.lock=Math.max(0,m.lock-dt);m.flash=Math.max(0,m.flash-dt);
    for(const g of R.ghosts){if(!g.dead&&g.gone<=0&&Math.hypot(g.x-p.x,g.y-p.y)<220){cancelMG('มีผีเข้าใกล้! ยกเลิกการกรีด');break;}}
  }
  // movement
  const mv=getMove(),sM=S.char==='siang'?.95:1;
  updObsPre(dt,mv);if(R.over)return;
  const busy=!!R.mg||!!R.grab||p.frozen>0||!!p.tumble||p.crash>0||!!R.pg||!!R.tie||!!p.sit||!!p.ham||!!p.pop||p.fell>0||!!R.pq||!!R.carry||p.slideDown>0;
  const keysRun=In.keys.shift;let moving=false,base=0;
  if(p.frozen>0||R.grab||p.tumble||p.crash>0)p.slideT=0;
  const wantRun=(p.run||keysRun)&&!p.exh&&p.st>0;
  if(p.tumble){
    const tb=p.tumble;tb.t+=dt;const s=SL(p.x),dd=-tb.dir*s;
    tb.v+=(dd>.06?dd*520-60:-(Math.abs(s)<.08?420:700))*dt;tb.vmax=Math.max(tb.vmax,tb.v);
    p.x+=tb.dir*Math.max(0,tb.v)*dt;tb.rot+=tb.dir*dt*14;R.noise.extra=Math.max(R.noise.extra,.7);
    let hit=false;for(const t of R.trees){if(Math.abs(t.x-p.x)<22&&Math.abs(t.y-p.y)<16){hit=true;break;}}
    if(tb.v<60||hit||p.x<=32||p.x>=WW-32){
      const dmg=Math.round(clamp(5+(tb.vmax-275)/30,5,10));p.hp-=dmg;p.hurt=.5;p.bounce=.6;p.tumble=null;p.inv=.8;
      sfx.thud();noiseAt(p.x,p.y,420);R.noise.extra=.9;say('โอ๊ย! ระบมไปหมด -'+dmg,2);if(p.hp<=0)die('กลิ้งตกเนิน');
    }
  }else if(p.crash>0){
    p.crash-=dt;
    if(p.crash<=0){p.crash=0;p.hp-=30;p.hurt=.6;sfx.thud();R.noise.extra=1;noiseAt(p.x,p.y,560,'255,120,120');say('โอ๊ย... หัวปักดินเลย',2.2);if(p.hp<=0)die('ตกจากฟ้า');}
  }else if(p.fly){
    const fs=(wantRun?190:105)*1.5*sM,has=mv.m>.12;
    const k=Math.min(1,dt*1.3);p.vx+=((has?mv.x*fs:0)-p.vx)*k;p.vy+=((has?mv.y*fs*.8:0)-p.vy)*k;
    p.x+=p.vx*dt;p.y+=p.vy*dt;if(Math.abs(p.vx)>20)p.face=sgn(p.vx);
    moving=Math.hypot(p.vx,p.vy)>25;p.st-=8*dt;p.stDelay=1;
    if(p.st<=0){p.st=0;p.exh=true;p.fly=false;p.crash=2;p.flyCd=10;p.vx=0;p.vy=0;sfx.thud();toast('สตามินาหมด! ตกลงพื้นแรงมาก',3);}
  }else if(!busy){
    let speed=0,dx=0,dy=0;
    if(p.slideT>0){const m=mv.m>.12?mv:{x:p.face,y:0,m:1};dx=m.x;dy=m.y;speed=(wantRun?190:110)*1.2;base=wantRun?.8:.38;moving=true;}
    else if(mv.m>.12){dx=mv.x;dy=mv.y;moving=true;
      if(p.crouch){speed=52;base=.12;}else if(wantRun){speed=190;base=.8;}else{speed=110;base=.38;}
      speed*=Math.min(1,mv.m*1.2);}
    speed*=sM*clsSpeedMul();if(p.slow>0)speed*=.5;
    if(moving){
      const mm=Math.hypot(dx,dy)||1,ndx=dx/mm,up=ndx*SL(p.x);let mult=1;
      if(up>0)mult=S.cls==='climber'?1:1/(1+up*2.4);else if(up<0)mult=1+(-up)*1.6;
      const sp2=speed*mult;
      if(up<-.05&&sp2>275&&!p.crouch){p.tumble={dir:sgn(ndx),v:sp2,vmax:sp2,t:0,rot:0};R.mg=null;p.run=false;p.slideT=0;moving=false;say('ว้ายยย กลิ้งแล้ว!',2);sfx.whoosh();}
      else{p.x+=ndx*sp2*dt;p.y+=(dy/mm)*sp2*.8*dt;if(Math.abs(dx)>.15)p.face=sgn(dx);}
    }
  }
  p.moving=moving&&!busy;
  if(p.moving)p.walkT+=dt*((p.fly?150:p.crouch?52:p.run?190:110)/110);
  // stamina
  if(p.fly){}
  else if(p.moving&&wantRun&&p.slideT<=0){p.st-=20*dt;p.stDelay=1;if(p.st<=0){p.st=0;p.exh=true;p.run=false;}}
  else{if(p.stDelay>0)p.stDelay-=dt;else p.st=Math.min(100,p.st+14*dt);if(p.exh&&p.st>25)p.exh=false;}
  // noise
  let target=0;if(!p.fly&&p.moving)target=base+(p.slideT>0?.3:0);
  target=Math.min(1,target+R.noise.extra);
  if(p.hiding){R.noise.extra=0;R.noise.level=0;}else R.noise.level+=(target-R.noise.level)*Math.min(1,dt*8);
  // collisions
  p.x=clamp(p.x,30,WW-30);p.y=clamp(p.y,215,YB);
  if(!p.fly)for(const t of R.trees){if(Math.abs(t.x-p.x)>40||Math.abs(t.y-p.y)>40)continue;const ddx=p.x-t.x,ddy=p.y-t.y,dd=Math.hypot(ddx,ddy);if(dd<17){const k=(17-dd)/(dd||1);p.x+=ddx*k;p.y+=ddy*k;}}
  // targets
  R.nearTree=null;R.nearCar=false;
  if(!busy&&!p.fly){let bd=60;for(const t of R.trees){if(!t.target||t.done)continue;const d=Math.hypot(t.x-p.x,t.y-p.y);if(d<bd){bd=d;R.nearTree=t;}}
    if(R.leave&&Math.hypot(CAR.x+50-p.x,CAR.y-p.y)<120)R.nearCar=true;}
  updObs(dt,busy);
  // stones
  for(const s of R.stones){s.t+=dt;if(s.t>=s.dur&&!s.done){s.done=true;
    if(s.kind==='spit'){
      sfx.splat();noiseAt(s.x1,s.y1,240,'200,240,210');let hit=false;
      for(const g of R.ghosts){if(g.dead||g.gone>0)continue;if(Math.hypot(g.x-s.x1,g.y-s.y1)<40){g.slowT=5;g.slowF=.5;hit=true;}}
      R.puddles.push({x:s.x1,y:s.y1,r:rnd(30,38)});
      if(hit)say('โดนเต็มๆ ฮิๆ ช้าลงแล้ว!',1.8);
      for(let i=0;i<8;i++)R.fx.push({x:s.x1,y:s.y1,vx:rnd(-60,60),vy:rnd(-110,-20),t:0,life:.45,col:'#d8f5d0'});
    }else{
      sfx.thud();noiseAt(s.x1,s.y1,380);
      for(const g of R.ghosts){if(g.dead||g.gone>0)continue;if(Math.hypot(g.x-s.x1,g.y-s.y1)<40){
        if(GH[g.type].stun){stunGhost(g,2);say('เย้ ตูมเดียวนอน!',1.6);}
        else if(g.type==='kuman'&&(g.state==='chase'||g.state==='pester')){g.state='laugh';g.lt=1.4;sfx.laugh();}}}
      for(let i=0;i<6;i++)R.fx.push({x:s.x1,y:s.y1,vx:rnd(-70,70),vy:rnd(-110,-20),t:0,life:.4,col:'#b9b3a0'});
    }}}
  R.stones=R.stones.filter(s=>!s.done);
  // piles, knives
  for(const pl of R.piles){pl.t+=dt;if(pl.hit)continue;for(const g of R.ghosts){if(g.dead||g.gone>0)continue;if(Math.hypot(g.x-pl.x,g.y-pl.y)<54){
    pl.hit=true;const a=Math.atan2(g.y-pl.y,g.x-pl.x);g.x=clamp(g.x+Math.cos(a)*340,50,WW-50);g.y=clamp(g.y+Math.sin(a)*170,230,YB-15);g.stun=1.4;g.state=g.type==='pop'?'return':'wander';g.wt=0;
    for(let i=0;i<14;i++)R.fx.push({x:pl.x,y:pl.y-10,vx:rnd(-120,120),vy:rnd(-160,-20),t:0,life:.6,col:'#f3e18a'});sfx.hit();say('ข้าวสาลีเอาอยู่!',1.6);break;}}}
  R.piles=R.piles.filter(pl=>!pl.hit);
  for(const k of R.knives){k.t+=dt;for(const g of R.ghosts){if(g.dead||g.gone>900)continue;if(Math.hypot(g.x-k.x,g.y-k.y)<135){g.dead=true;g.fade=1;sfx.fire();say('หายไปแล้ว ขอบคุณมีดอาคม!',2);for(let i=0;i<16;i++)R.fx.push({x:g.x,y:g.y-40,vx:rnd(-90,90),vy:rnd(-130,-20),t:0,life:.8,col:'#ff9a3c'});}}}
  // ghosts
  for(const g of R.ghosts)updGhost(g,dt);
  updSpooks(dt);
  for(const g of R.ghosts){const aw=!g.dead&&g.gone<=0&&g.stun<=0&&!hidP(p)&&isAware(g);if(aw&&!g.aw&&!(g.encCd>0)){encounter(g);g.encCd=9;}g.aw=aw;if(g.encCd>0)g.encCd-=dt;}
  R.aware=R.ghosts.some(g=>g.aw)?1:0;
  if(R.enc){R.enc.t+=dt;if(R.enc.t>.85)R.enc=null;}
  R.flashW=Math.max(0,R.flashW-dt*2.2);
  R.vein+=((p.hp<40?clamp((40-p.hp)/40,0,1)*.95:0)-R.vein)*Math.min(1,dt*2);
  // fx & ripples
  for(const f of R.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=380*dt;}R.fx=R.fx.filter(f=>f.t<f.life);
  for(const r of R.ripples)r.r+=dt*520;R.ripples=R.ripples.filter(r=>r.r<r.max);
  // eyes + fear
  let near=null,nd=520;for(const g of R.ghosts){if(g.dead||g.gone>0)continue;const d=Math.hypot(g.x-p.x,g.y-p.y);if(d<nd){nd=d;near=g;}}
  let lx=p.face,ly=0;
  if(near){const v=eyeLook(p.x,p.y-40,near.x,near.y-GH[near.type].h*.5);lx=(near.x-p.x)>0?Math.abs(v.x)+.001:-Math.abs(v.x)-.001;lx=v.x;ly=v.y;}
  else if(R.nearTree){const v=eyeLook(p.x,p.y,R.nearTree.x,R.nearTree.y-60);lx=v.x;ly=v.y;}
  else if(p.moving){lx=mv.x;ly=mv.y*.7;}
  p.pdx+=(lx-p.pdx)*Math.min(1,dt*10);p.pdy+=(ly-p.pdy)*Math.min(1,dt*10);
  const fear=(nd<260)||R.grab||p.frozen>0||p.slow>0;p.pr+=((fear?.45:1)-p.pr)*Math.min(1,dt*8);
  // camera
  if(S.char==='siang'&&!busy&&!p.fly){R.giggle-=dt;if(R.giggle<=0){R.giggle=rnd(16,30);let close=false;for(const g of R.ghosts){if(!g.dead&&g.gone<=0&&Math.hypot(g.x-p.x,g.y-p.y)<420)close=true;}
    if(!close){say(pick(['ฮึๆๆๆ... ตลกอ่ะ','ฮิๆ ... คิดอะไรขำๆ ได้','หึๆๆ ไม่รู้ขำอะไร']),2.2);sfx.laugh();R.noise.extra=Math.max(R.noise.extra,.3);}}}
  R.nt=null;let bdn=1e9;for(const t of R.targets){if(t.done)continue;const dd=Math.hypot(t.x-p.x,t.y-p.y);if(dd<bdn){bdn=dd;R.nt=t;}}R.ntd=bdn;
  const c=R.cam;c.x+=(clamp(p.x-W/2,0,WW-W)-c.x)*Math.min(1,dt*5);c.y+=(clamp(p.y-E(p.x)-310-(p.fly?40:0),-700,WH-H)-c.y)*Math.min(1,dt*5);
  updZoom(dt);
  if(p.hp<=0&&!R.over)die('ถูกผีทำร้าย');
}

function showResult(){
  const R=S.run,j=R.job;let earn=0;
  if(R.hunt)return huntResult();
  if(R.wake)return wakeResult();
  if(!R.dead)earn=Math.round(Math.floor(j.pay*R.done/R.need)/10)*10;
  S.money+=earn;save();S.mode='result';
  $('result').innerHTML=R.sleep
   ?`<div class="rc-head">หลับยาว</div><p class="rc-story">“${R.why}”</p><div class="rc-total"><span>ค่าจ้างที่ได้</span><b>฿ 0</b></div><div class="rc-btns"><button id="r-ok" class="go">กลับเถียงนา</button></div>`
   :R.dead
   ?`<div class="rc-head">ถูกผีเล่นงาน</div><div class="rc-sub">${R.why||''}</div><p class="rc-story">เรื่องนี้ไม่มีค่าจ้างนะ กลับเถียงนาไปพักก่อน แล้วลองอ่านหนังสือผีไทยดูอีกที</p><div class="rc-total"><span>ค่าจ้างที่ได้</span><b>฿ 0</b></div><div class="rc-btns"><button id="r-ok" class="go">กลับเถียงนา</button></div>`
   :`<div class="rc-head">จบงาน</div><div class="rc-sub">ผู้ว่าจ้าง ${j.owner}</div><dl><dt>กรีดได้</dt><dd>${R.done} / ${R.need} ต้น</dd><dt>ค่าจ้างเต็ม</dt><dd>฿ ${j.pay.toLocaleString()}</dd></dl><div class="rc-total"><span>ได้รับ</span><b>฿ ${earn.toLocaleString()}</b></div><div class="rc-btns"><button id="r-ok" class="go">กลับเถียงนา</button></div>`;
  if(earn>0)sfx.coin();syncUI();
}
$('result').addEventListener('click',e=>{if(e.target.id==='r-ok'){fadeTo(()=>{S.mode='hut';S.hut.state='wait';S.hut.timer=rnd(2,4);S.run=null;syncUI();say('ได้เงินแล้ว ไปซื้อของกันผีดีกว่า',2.6);});}});

/* ---- play pointer ---- */
function playDown(id,x,y){
  const R=S.run;if(!R||R.over)return;
  if(R.wake)return wkDown(id,x,y);
  if(R.hunt)return huntDown(id,x,y);
  if(R.pg){pgTap(x,y);return;}
  if(R.pq){pqTap(x,y);return;}
  if(R.grab){grabTap();return;}

/* sanity */
function mkVeins(){const V=[];for(let i=0;i<34;i++){const e=i%4;let x,y,a;
  if(e===0){x=rnd(0,W);y=0;a=Math.PI/2;}else if(e===1){x=rnd(0,W);y=H;a=-Math.PI/2;}else if(e===2){x=0;y=rnd(0,H);a=0;}else{x=W;y=rnd(0,H);a=Math.PI;}
  const n=rndi(6,10),seg=rnd(70,170)/n,pts=[[x,y]];for(let j=0;j<n;j++){a+=rnd(-.7,.7);x+=Math.cos(a)*seg;y+=Math.sin(a)*seg;pts.push([x,y]);}
  V.push({pts,w:rnd(1.5,3.5)});
  if(Math.random()<.6){const k=rndi(2,4);let bx=pts[k][0],by=pts[k][1],ba=a+rnd(-1.2,1.2);const bp=[[bx,by]];for(let j=0;j<4;j++){ba+=rnd(-.6,.6);bx+=Math.cos(ba)*seg*.8;by+=Math.sin(ba)*seg*.8;bp.push([bx,by]);}V.push({pts:bp,w:1.2});}}
  return V;}
function drawVeins(R){
  const c=ctx,v=R.vein,pu=.85+.15*Math.sin(S.t*6);
  c.save();const gg=c.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.95);gg.addColorStop(0,'rgba(110,0,10,0)');gg.addColorStop(1,`rgba(110,0,10,${.6*v*pu})`);c.fillStyle=gg;c.fillRect(0,0,W,H);
  c.lineCap='round';c.lineJoin='round';
  for(const vn of R.veins){const segs=(vn.pts.length-1)*v;if(segs<=0)continue;
    c.beginPath();c.moveTo(vn.pts[0][0],vn.pts[0][1]);const full=Math.floor(segs);
    for(let i=1;i<=full&&i<vn.pts.length;i++)c.lineTo(vn.pts[i][0],vn.pts[i][1]);
    if(full<vn.pts.length-1){const f=segs-full,a=vn.pts[full],b=vn.pts[full+1];c.lineTo(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f);}
    c.strokeStyle=`rgba(40,0,4,${.5*v})`;c.lineWidth=vn.w*(.8+v)*pu+2;c.stroke();
    c.strokeStyle=`rgba(190,20,30,${.35+.55*v})`;c.lineWidth=vn.w*(.6+v)*pu;c.stroke();}
  c.restore();}
/* ---- drawer notebook: 3 bookmark tabs ---- */
function renderDrawer(){
  const R=S.run;if(!R)return;
  const tab=R.dtab||'ev',on=Object.keys(R.notes).filter(t=>R.notes[t]);
  const ribs=`<div class="ribs">${[['ev','ตรวจหลักฐาน'],['lore','ที่มาของผี'],['san','ค่าสติ']].map(([k,n])=>`<button class="rib ${k}${tab===k?' cur':''}" data-rib="${k}" aria-label="${n}" title="${n}"><i>${RIBI[k]}</i></button>`).join('')}</div>`;
  const x=`<button class="x" id="dr-x" aria-label="ปิด">✕</button>`;
  const dr=$('drawer');dr.className='panel'+(tab==='ev'?'':' one');
  if(tab==='ev'){
    const rows=Object.keys(HG).map(id=>{const h=HG[id];const fit=on.length&&on.every(t=>h.topics.includes(t));
      return `<div class="dg${fit?' fit':''}${R.guess===id?' sel':''}"><canvas width="120" height="120" data-gh="${id}"></canvas><div><b>${h.name}</b><div class="tic">${h.topics.map(t=>`<i title="${TDESC[t]}">${TICON[t]}<b>${TNAME[t]}</b></i>`).join('')}</div></div><button data-pick="${id}" aria-label="เลือก ${h.name}">${R.guess===id?'✔':'เลือก'}</button></div>`;}).join('');
    dr.innerHTML=`${x}${ribs}<div class="bk-list tpl">${Object.keys(TNAME).map(t=>`<button class="tp${R.notes[t]?' on':''}" data-tp="${t}"><i>${TICON[t]}</i><span>${TNAME[t]}</span><em>${TDESC[t]}</em></button>`).join('')}</div>
    <div class="bk-detail" style="grid-template-columns:1fr"><p class="dghelp">วิธีใช้: เจอหลักฐานอะไร ให้แตะป้ายหลักฐานทางซ้ายเพื่อติ๊กไว้ ผีที่มีหลักฐานตรงกับที่ติ๊กจะเรืองกรอบเขียว (ป้ายใต้ชื่อผีคือหลักฐานของผีตนนั้น) แล้วกด "เลือก" ผีที่คิดว่าใช่ ก่อนกลับ</p><div class="dgl">${rows}</div></div>`;
  }else if(tab==='lore'){
    const rows=Object.keys(HG).map(id=>{const h=HG[id],l=LORE[id];
      return `<div class="dg lore"><canvas width="120" height="120" data-gh="${id}"></canvas><div class="lt"><b>${h.name}</b><p class="ln"><u>ที่มาและประวัติ</u> ${l[0]}</p><p class="ln"><u>วิธีจัดการ</u> ${l[1]}</p></div></div>`;}).join('');
    dr.innerHTML=`${x}${ribs}<div class="bk-detail pg" style="grid-template-columns:1fr"><div class="dgl">${rows}</div></div>`;
  }else{
    const s=Math.round(R.san),st=R.insane?'สติแตก — เดินช้าลง 40%':s<35?'เริ่มเครียด':'ปกติ';
    dr.innerHTML=`${x}${ribs}<div class="bk-detail pg san" style="grid-template-columns:1fr"><div class="sbig"><i class="bi5">${RIBI.san}</i><div class="sbar"><div class="sfill${R.insane?' bad':''}" style="width:${s}%"></div></div><b class="spct">${s}%</b><p class="sst${R.insane?' bad':''}">${st}</p></div>
    <div class="srow"><i>${RIBI.home}</i><span class="dn">▼</span><p>อยู่ในบ้านนานเกินไป สติลดลงช้าๆ</p></div>
    <div class="srow"><i>${RIBI.lore}</i><span class="dn">▼▼</span><p>เจอผีใกล้ๆ หรือถูกผีไล่ สติลดเร็ว</p></div>
    <div class="srow"><i>${RIBI.tree}</i><span class="up">▲</span><p>ออกไปอยู่นอกบ้านเพื่อสูดอากาศ สติจะค่อยๆ ฟื้น ความเร็วกลับเป็นปกติและเส้นเลือดจางหาย</p></div></div>`;
  }
  dr.querySelectorAll('canvas[data-gh]').forEach(cv2=>{const c=cv2.getContext('2d');c.fillStyle='#1b2340';c.fillRect(0,0,120,120);c.save();c.translate(60,114);c.scale(.6,.6);drawHuntGhost(c,cv2.dataset.gh,0,0,S.t,{thumb:true,face:1});c.restore();});
}

function legs2(c,pts,w,col){c.lineCap='round';c.lineJoin='round';c.strokeStyle=INK;c.lineWidth=w+3.5;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.stroke();c.strokeStyle=col;c.lineWidth=w;c.stroke();}
function ringTail(c,x,y,dir,t,big){
  c.save();c.translate(x,y);c.scale(dir,1);const n=9;
  for(let i=0;i<n;i++){const u=i/n,u2=(i+1)/n,sw=Math.sin(t*2)*6*u;
    const ax=-u*50+sw,ay=-u*(big?110:90)+Math.sin(u*3)*10,bx=-u2*50+sw,by=-u2*(big?110:90)+Math.sin(u2*3)*10;
    ol(c,2);c.strokeStyle=INK;c.lineWidth=14-u*3;c.lineCap='round';c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.stroke();
    c.strokeStyle=i%2?'#262628':'#e8e8ea';c.lineWidth=10-u*3;c.stroke();}
  c.restore();
}

function genBananas(job,trees){

  while(list.length<n&&tries++<80){
    const x=rnd(700,WW-200),y=rnd(330,Math.max(340,YB-70));
    if(job.hill&&(Math.abs(SL(x))>.02||Math.abs(SL(x-30))>.02||Math.abs(SL(x+30))>.02))continue;

}

const ITEMKEYS=['wheat','knife','rope','buffalo','pot'];
function hidP(p){return !!(p.fly||p.hiding||(S.run&&S.run.carry));}
function segX(ax,ay,bx,by,cx,cy,dx,dy){const d1=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx);if(Math.abs(d1)<1e-9)return false;const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d1,u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d1;return t>=0&&t<=1&&u>=0&&u<=1;}
function fenceBlock(x0,y0,x1,y1){const R=S.run;if(!R||!R.fences)return false;for(const f of R.fences)if(segX(x0,y0,x1,y1,f.a.x,f.a.y,f.b.x,f.b.y))return true;return false;}
function segRect(x0,y0,x1,y1,rx0,ry0,rx1,ry1){let t0=0,t1=1;const dx=x1-x0,dy=y1-y0;
  for(const[p,q]of[[-dx,x0-rx0],[dx,rx1-x0],[-dy,y0-ry0],[dy,ry1-y0]]){if(p===0){if(q<0)return false;}else{const r=q/p;if(p<0){if(r>t1)return false;if(r>t0)t0=r;}else{if(r<t0)return false;if(r<t1)t1=r;}}}
  return true;}
function coverBlock(g,p){const R=S.run;if(!R.obs)return false;for(const o of R.obs){if(o.k!=='sack')continue;if(segRect(g.x,g.y,p.x,p.y,o.x-o.w/2-6,o.y-16,o.x+o.w/2+6,o.y+16))return true;}return false;}
function pushOut(e,o){const rx=o.w/2+13,ry=18,ex=(e.x-o.x)/rx,ey=(e.y-o.y)/ry,d=ex*ex+ey*ey;if(d<1){const m=Math.sqrt(d)||.001;e.x=o.x+ex/m*rx;e.y=o.y+ey/m*ry;}}

function genObstacles(job,trees){
  const list=[],n=rndi(2,3);let hut=0,ham=0,tries=0;
  const flat=(x,r)=>!job.hill||(Math.abs(SL(x-r))<.02&&Math.abs(SL(x))<.02&&Math.abs(SL(x+r))<.02&&Math.abs(E(x-r)-E(x+r))<2);
  const clash=o=>list.some(q=>Math.hypot(q.x-o.x,(q.y-o.y)*1.5)<q.r+o.r+50);
  while(list.length<n&&tries++<120){
    const k=pick(['bush','pond','sack','hut','ham','pond','bush']);
    if((k==='hut'&&hut)||(k==='ham'&&ham))continue;
    if(k==='ham'){
      const prs=[];for(const a of trees)for(const b of trees){if(a.x<b.x&&b.x-a.x>=140&&b.x-a.x<=240&&Math.abs(a.y-b.y)<36&&!a.keep&&!b.keep&&a.x>650&&flat((a.x+b.x)/2,130))prs.push([a,b]);}
      if(!prs.length)continue;const[a,b]=pick(prs),o={k,x:(a.x+b.x)/2,y:(a.y+b.y)/2,a,b,r:60};
      if(clash(o))continue;a.keep=b.keep=true;list.push(o);ham=1;continue;}
    const o={k,x:rnd(720,WW-240),y:rnd(330,Math.max(340,YB-120))};
    if(k==='bush'){o.r=46;}
    else if(k==='pond'){o.r=rnd(70,150);o.ghost=Math.random()<.5;o.cyc=rnd(0,5);o.hx=o.x;o.hy=o.y;o.last=-1;}
    else if(k==='sack'){o.tiers=rndi(3,4);o.w=o.tiers*30;o.r=o.w/2+16;}
    else{o.r=72;}
    if(!flat(o.x,o.r+20)||clash(o))continue;
    if(k==='hut')hut=1;
    list.push(o);
    trees=trees.filter(t=>t.keep||Math.hypot(t.x-o.x,(t.y-o.y)*1.5)>o.r+36);
  }
  return{list,trees};
}

function updBuffs(dt){

      b.life+=dt;b.cd-=dt;
      if(b.life>16){b.st='leave';b.t=0;continue;}
      if(b.pause>0){b.pause-=dt;b.bx+=Math.cos(b.ang||0)*120*Math.max(0,b.pause)*dt;continue;}
      if(!b.tgt||b.tgt.dead||b.tgt.gone>0||b.tgt.sealing){b.tgt=null;let bd=1100;for(const g of R.ghosts){if(g.dead||g.gone>0||g.sealing)continue;const d=Math.hypot(g.x-b.bx,g.y-b.by);if(d<bd){bd=d;b.tgt=g;}}}
      let tx,ty,sp=440;
      if(b.tgt){tx=b.tgt.x;ty=b.tgt.y;}else{tx=p.x+60;ty=p.y+10;sp=170;}
      const dx=tx-b.bx,dy=ty-b.by,d=Math.hypot(dx,dy);
      if(d>8){const s=Math.min(d,sp*dt);b.bx+=dx/d*s;b.by+=dy/d*s;b.ang=Math.atan2(dy,dx);if(Math.abs(dx)>4)b.face=sgn(dx);b.run=true;}
      b.by=clamp(b.by,215,YB);b.bx=clamp(b.bx,30,WW-30);
      if(b.tgt&&d<52&&b.cd<=0){
        const g=b.tgt;g.bhit=(g.bhit||0)+1;b.cd=.9;b.pause=.55;sfx.thud();sfx.hit();noiseAt(g.x,g.y,300,'255,220,120');
        for(let i=0;i<12;i++)R.fx.push({x:g.x,y:g.y-40,vx:rnd(-160,160),vy:rnd(-170,-20),t:0,life:.6,col:pick(['#ffe27a','#fff','#ffb347'])});
        if(g.bhit>3){g.dead=true;g.fade=1;sfx.fire();say('ผีสลายไปแล้ว! ควายธนูสุดยอด!',2);b.tgt=null;}
        else{g.stun=1.3;if(g.state==='call'||g.state==='chase'||g.state==='charge')g.state=g.type==='pop'?'return':'wander';
          const a=Math.atan2(g.y-b.by,g.x-b.bx);g.x=clamp(g.x+Math.cos(a)*110,50,WW-50);g.y=clamp(g.y+Math.sin(a)*50,230,YB-15);b.tgt=null;}
      }
    }else if(b.st==='leave'){b.a=Math.max(0,1-b.t);if(b.t>=1)b.done=true;}
  }
  R.buffs=R.buffs.filter(b=>!b.done);
}
function placePot(){
  const R=S.run,p=R.p;if(skillBlocked())return;S.inv.pot--;save();
  R.pots.push({x:clamp(p.x+p.face*42,40,WW-40),y:p.y,st:'idle',vx:0,g:null,prog:0,rolled:0,rot:0,bt:0,sh:[]});
  sfx.hit();say('วางหม้อแล้ว อย่าเดินชนนะ!',1.8);toast('หม้อดินดูดผีที่เข้าใกล้ ถ้าถูกชน/กลิ้งตกเนินจนแตก ผีจะหลุดออกมา',4.5);
}
function breakPot(pt){
  const R=S.run;if(pt.st==='broken')return;
  const g=pt.g;pt.st='broken';pt.bt=0;pt.g=null;
  if(g){g.sealing=null;g.sealed=false;g.gone=0;g.sc=1;g.stun=2.2;g.state=g.type==='pop'?'idle':'wander';g.x=pt.x;g.y=pt.y;g.home={x:pt.x,y:pt.y};g.cool=3;g.wt=0;say('หม้อแตก! ผีหลุดออกมาแล้ว!',2);}
  sfx.spark();noiseAt(pt.x,pt.y,420,'255,160,90');
  for(let i=0;i<14;i++)R.fx.push({x:pt.x,y:pt.y-14,vx:rnd(-150,150),vy:rnd(-190,-30),t:0,life:.8,col:pick(['#c0683a','#8a4528','#e0905a'])});
}
function updPots(dt){
  const R=S.run,p=R.p;
  for(const pt of R.pots){
    if(pt.st==='broken'){pt.bt+=dt;continue;}
    const sl=SL(pt.x);
    if(pt.st==='idle'&&Math.abs(sl)>.05){pt.st='roll';pt.vx=0;pt.rolled=0;if(pt.g)pt.g.sealing=null;}
    if(pt.st==='roll'){pt.rolled+=dt;pt.vx+=-sl*900*dt;pt.x+=pt.vx*dt;pt.rot+=pt.vx*dt/14;
      if(pt.x<24||pt.x>WW-24||(pt.rolled>.3&&Math.abs(SL(pt.x))<.03)){breakPot(pt);continue;}}
    if(!p.fly&&!p.sit&&!p.ham&&Math.hypot(p.x-pt.x,(p.y-pt.y)*1.6)<24){breakPot(pt);say('ชนหม้อแตกแล้ว!',1.6);continue;}
    let hitG=false;for(const g of R.ghosts){if(g.dead||g.gone>0||g===pt.g||g.type==='kras')continue;if(Math.hypot(g.x-pt.x,(g.y-pt.y)*1.6)<28){hitG=true;break;}}
    if(hitG){breakPot(pt);continue;}
    if(pt.st==='idle'&&!pt.g){let bd=170,bg=null;for(const g of R.ghosts){if(g.dead||g.gone>0||g.sealing)continue;const d=Math.hypot(g.x-pt.x,g.y-pt.y);if(d<bd){bd=d;bg=g;}}
      if(bg){pt.g=bg;bg.sealing=pt;bg.sc=1;pt.st='seal';pt.prog=0;sfx.whistle();}}
    if(pt.st==='seal'&&pt.g){const g=pt.g;pt.prog+=dt;g.sc=Math.max(0,1-pt.prog/6);g.x+=(pt.x-g.x)*Math.min(1,dt*.9);g.y+=(pt.y-g.y)*Math.min(1,dt*.9);
      if(pt.prog>=6){g.gone=1e6;g.sealed=true;g.sealing=null;g.sc=1;pt.st='sealed';sfx.good();say('จับผีใส่หม้อได้แล้ว!',1.8);}}
  }
}

function enterObs(o){
  const R=S.run,p=R.p;
  if(o.k==='hut'){p.sit=o;p.x=o.x;p.y=o.y+4;p.run=false;p.crouch=false;say('นั่งพักเถียงนา ลมเย็นดี',1.8);toast('นั่งพัก แรงฟื้นเร็ว ผีขึ้นมาได้ด้วย! ขยับจอยหรือกดมือเพื่อลง',3.5);}
  else if(o.k==='ham'){p.ham=o;p.hamT=0;p.x=o.x;p.y=o.y+6;p.run=false;p.crouch=false;sfx.hit();say('เปล...สบายจัง',1.8);toast('แรงฟื้นเร็วมาก แต่อย่านอนเกิน 5 วินาที!',3.5);}
}
function dismount(){const p=S.run.p;if(p.sit){p.y=p.sit.y+36;p.sit=null;}if(p.ham){p.y=p.ham.y+40;p.ham=null;p.hamT=0;p.closed=false;}}
function startPG(o){
  const R=S.run,p=R.p;R.mg=null;R.tie=null;p.run=false;p.slideT=0;
  const a=Math.random()*6.28;R.pg={o,t:4,taps:0,cx:rnd(200,760),cy:rnd(150,380),vx:Math.cos(a)*330,vy:Math.sin(a)*330};
  sfx.growl();say('อึก! ผีพรายจับขา!',2);
}
function pgTap(x,y){const R=S.run,g=R.pg;if(!g)return;
  if(Math.hypot(x-g.cx,y-g.cy)<44){g.taps++;sfx.hit();const a=Math.random()*6.28,sp=Math.hypot(g.vx,g.vy)*1.1;g.vx=Math.cos(a)*sp;g.vy=Math.sin(a)*sp;}}
function updObsPre(dt,mv){
  const R=S.run,p=R.p;
  if((p.sit||p.ham)&&mv.m>.3)dismount();
  if(R.tie){if(mv.m>.5)R.tie=null;else{R.tie.t+=dt;if(R.tie.t>=1.4)finishTie();}}
  let hid=false,inPond=null;
  if(!p.fly&&!p.pop&&!R.carry)for(const o of R.obs){
    if(o.k==='bush'){const ex=(p.x-o.x)/(o.r*.8),ey=(p.y-o.y)/22;if(ex*ex+ey*ey<1)hid='bush';}
    else if(o.k==='pond'){const ex=(p.x-o.x)/(o.r*.92),ey=(p.y-o.y)/(o.r*.4);if(ex*ex+ey*ey<1){hid='pond';inPond=o;}}}
  if(R.pg){hid='pond';inPond=R.pg.o;}
  if(hid&&!p.hiding){toast(hid==='bush'?'ซ่อนในพุ่มไม้ ไม่มีเสียง ผีมองไม่เห็น':'ลงบ่อน้ำ ไม่มีเสียง ผีมองไม่เห็น (ระวังผีพราย)',3);if(hid==='pond')sfx.thud();}
  p.hiding=hid;R.inPond=inPond;p.wsink=(p.wsink||0)+(((hid==='pond'&&!p.pop)?.38:0)-(p.wsink||0))*Math.min(1,dt*9);
  for(const o of R.obs){if(o.k!=='pond'||!o.ghost)continue;
    o.cyc+=dt;const ph=o.cyc%5,cycN=Math.floor(o.cyc/5);
    if(cycN!==o.last){o.last=cycN;o.hx=o.x+rnd(-.6,.6)*o.r;o.hy=o.y+rnd(-.5,.5)*o.r*.36;sfx.cricket();}
    o.hair=ph<2;
    if(o.hair&&R.inPond===o&&!R.pg&&!p.pop){const dx=p.x-o.hx,dy=p.y-o.hy,d=Math.hypot(dx,dy);if(d>1){o.hx+=dx/d*Math.min(d,110*dt);o.hy+=dy/d*Math.min(d,110*dt);}
      if(d<28)startPG(o);}}
  if(R.pg){const g=R.pg;g.t-=dt;p.sink=Math.min(.85,(4-g.t)/4);
    g.cx+=g.vx*dt;g.cy+=g.vy*dt;if(g.cx<60||g.cx>900)g.vx*=-1;if(g.cy<110||g.cy>440)g.vy*=-1;g.cx=clamp(g.cx,60,900);g.cy=clamp(g.cy,110,440);
    if(g.taps>=5){const o=g.o,a=Math.atan2((p.y-o.y)/.4,p.x-o.x);R.pg=null;p.sink=0;
      p.pop={t:0,x0:p.x,y0:p.y,x1:o.x+Math.cos(a)*(o.r*.92+46),y1:o.y+Math.sin(a)*(o.r*.4+22)};sfx.whoosh();}
    else if(g.t<=0){R.pg=null;die('ผีพรายลากลงบ่อ');}}
  if(p.pop){const q=p.pop;q.t+=dt;const u=clamp(q.t/.6,0,1);p.x=q.x0+(q.x1-q.x0)*u;p.y=q.y0+(q.y1-q.y0)*u;p.hop=Math.sin(u*Math.PI)*70;
    p.closed=q.t<1.3;p.inv=Math.max(p.inv,1);if(q.t>=1.3&&!q.said){q.said=true;say('แค่ก... ฟื้นแล้ว ลุกขึ้น!',2);}
    if(q.t>=1.9){p.pop=null;p.hop=0;p.closed=false;}}
  else p.hop=0;
  if(!R.pg&&p.sink>0)p.sink=0;
}
function updObs(dt,busy){
  const R=S.run,p=R.p;
  R.nearObs=null;R.nearTreeAny=null;
  if(!busy&&!p.fly&&!p.sit&&!p.ham&&!p.pop){
    for(const o of R.obs){
      if(o.k==='hut'&&Math.hypot(p.x-o.x,(p.y-o.y)*1.4)<o.r+14)R.nearObs=o;
      if(o.k==='ham'&&Math.hypot(p.x-o.x,(p.y-o.y)*1.4)<46)R.nearObs=o;}
    if(R.rope.hold){let bd=60;for(const t of R.trees){const d=Math.hypot(t.x-p.x,t.y-p.y);if(d<bd){bd=d;R.nearTreeAny=t;}}}
  }
  for(const o of R.obs){if(o.k!=='sack')continue;if(!p.fly)pushOut(p,o);for(const g of R.ghosts)if(!g.dead&&g.gone<=0&&!g.sealing)pushOut(g,o);}
  if(p.sit&&!R.over){p.st=Math.min(100,p.st+42*dt);if(p.exh&&p.st>25)p.exh=false;}
  if(p.ham&&!R.over){p.hamT+=dt;p.st=Math.min(100,p.st+60*dt);if(p.exh&&p.st>25)p.exh=false;p.closed=p.hamT>3.2;
    if(p.hamT>3&&!R.hamWarn){R.hamWarn=true;toast('ง่วงจัง... ลงจากเปลเร็ว!',2.5);}
    if(p.hamT>5){R.over=true;R.dead=true;R.sleep=true;R.why=R.sleepMsg;R.overT=3.4;R.mg=null;sfx.hang();}}
  else R.hamWarn=false;
  updBuffs(dt);updPots(dt);
}

  else if(g.state==='investigate'){const dd=moveToward(g,g.tx,g.ty,200,dt);g.it-=dt;if(dd<14||g.it<=0){g.state='wander';g.wt=0;}if(can&&(hears(g)||d<sight)){g.state='chase';g.lost=0;g.rolled=false;sfx.growl();}}
  else if(g.state==='chase'){
    if(!can){g.state='investigate';g.tx=p.x;g.ty=p.y;g.it=3;return;}
    if(!g.rolled&&d<260){g.rolled=true;if(Math.random()<.4){g.state='leap';g.lt=.4;g.leapT=0;g.lx=p.x;g.ly=p.y;sfx.growl();return;}}

  if(Math.abs(t.pos-t.zone)<=t.zw/2+.02){R.bandN++;R.bandT+=3;t.flash=.3;t.zone=rnd(.2,.8);t.zw=Math.max(.1,t.zw-.015);t.sp+=.1;
    tone(pick([440,523,659,784]),.2,'square',.07);tone(pick([523,659,784,988]),.2,'triangle',.06,0,.08);
    for(let i=0;i<3;i++)R.noteFx.push({t:0,dx:rnd(-16,16),ch:pick(['♪','♫','♩'])});
    ctoast(`ผีทุกตัวช้าลง -${10*R.bandN} (เหลือ ${Math.ceil(R.bandT)} วิ)`,1.6);}
  else stopTr(true);
}
function shoot(){
  const R=S.run,p=R.p,hunt=!!R.hunt;let a=p.face>0?0:Math.PI,best=null,bd=640;
  const list=hunt?[R.g]:R.ghosts;
  for(const g of list){if(!g||g.dead||g.gone>0)continue;const d=Math.hypot(g.x-p.x,g.y-p.y);if(d<bd){bd=d;best=g;}}
  if(best){a=Math.atan2(best.y-p.y,best.x-p.x);if(Math.abs(best.x-p.x)>4)p.face=sgn(best.x-p.x);}
  for(const da of[-.2,.2])R.shots.push({x:p.x,y:p.y,a:a+da,t:0,life:.5});
  R.ammo--;R.cd.plan=5;R.cdMax.plan=5;R.gunT=.45;R.gunAng=a;
  hiss(.22,.35,900);tone(130,.14,'sawtooth',.22,40);
  if(!hunt){R.noise.extra=1;noiseAt(p.x,p.y,700,'255,200,120');}
  say('ปัง!!',1);if(R.ammo<=0)ctoast('กระสุนหมด! กดปุ่มเพื่อ Reload',2.5);
}
function shotHit(g){
  const R=S.run,p=R.p;g.shot=(g.shot||0)+1;g.bleed=2;sfx.bite();
  const a=Math.atan2(g.y-p.y,g.x-p.x);
  if(R.hunt){
    if(g.shot>3){g.shot=0;const rm=R.rooms.slice().sort((a,b)=>Math.abs(b.x0-R.p.x)-Math.abs(a.x0-R.p.x))[0];g.x=rm.x0+RW/2;g.y=RH/2;g.state='roam';g.pause=6;R.huntCd=Math.max(R.huntCd,60);R.heat=0;ctoast('ผีสลายหายไปไกล!',2.5);}
    else{g.x=clamp(g.x+Math.cos(a)*110,25,R.tot-25);g.y=clamp(g.y+Math.sin(a)*60,30,RH-20);if(g.state==='hunt'||g.state==='ending'||g.state==='plead'){g.state='ending';g.srch=1;}g.pause=3;R.huntCd=Math.max(R.huntCd,16);R.heat=0;ctoast('ยิงโดนผี! ผีกระเด็น',1.8);}
  }else{
    if(g.shot>3){g.dead=true;g.fade=1;ctoast('ผีสลายไปแล้ว!',2.2);for(let i=0;i<16;i++)R.fx.push({x:g.x,y:g.y-40,vx:rnd(-90,90),vy:rnd(-130,-20),t:0,life:.8,col:'#ff9a3c'});}

  }
}
function updShots(dt){
  const R=S.run;
  for(const sh of R.shots){sh.t+=dt;sh.x+=Math.cos(sh.a)*900*dt;sh.y+=Math.sin(sh.a)*900*dt*(R.hunt?1:.8);
    if(sh.t>=sh.life){sh.dead=true;continue;}
    const list=R.hunt?[R.g]:R.ghosts;
    for(const g of list){if(!g||g.dead||g.gone>0||(g.type==='krahang'&&(g.hz||150)>40))continue;
      if(Math.abs(g.x-sh.x)<32&&Math.abs(g.y-sh.y)<(R.hunt?32:26)){sh.dead=true;shotHit(g);break;}}}
  R.shots=R.shots.filter(s=>!s.dead);
  const list=R.hunt?[R.g]:R.ghosts;
  for(const g of list){if(g&&g.bleed>0){g.bleed-=dt;if(Math.random()<dt*22)R.fx.push({x:g.x+rnd(-8,8),y:g.y-(R.hunt?10:46),vx:rnd(-20,20),vy:rnd(-30,10),t:0,life:.5,col:'#c0212a',sol:'#c0212a',r:2});}}
}
function updClass(dt){
  const R=S.run,p=R.p;if(!R.cd)return;
  for(const k in R.cd)if(R.cd[k]>0)R.cd[k]=Math.max(0,R.cd[k]-dt);
  for(const k of['sodaT','mgBuffT','shieldT','revealT','reload','gunT','drinkAnim'])if(R[k]>0)R[k]=Math.max(0,R[k]-dt);
  if(R._rl&&R.reload<=0){R.ammo=2;R.cd.plan=10;R.cdMax.plan=10;ctoast('ใส่กระสุนแล้ว (รอคูลดาวน์ 10 วิ)',2.2);}R._rl=R.reload>0;
  if(R.bandT>0){R.bandT-=dt;if(R.bandT<=0){R.bandT=0;R.bandN=0;}}
  if(R.shieldT>0)p.inv=Math.max(p.inv||0,.3);
  if(R.tr){if(clsBlocked())stopTr(false);else updTr(dt);}
  for(const n of R.noteFx)n.t+=dt;R.noteFx=R.noteFx.filter(n=>n.t<1.2);
  updShots(dt);
}

  const bx=clamp(p.x,L.bed.x,L.bed.x+L.bed.w),by=clamp(p.y,L.bed.y,L.bed.y+L.bed.h),bdd=dd(bx,by);

function updWake(dt){
  const R=S.run,p=R.p,L=R.L;R.t+=dt;
  if(R.toast){R.toast.t-=dt;if(R.toast.t<=0)R.toast=null;}
  R.flash=Math.max(0,R.flash-dt);R.shake=Math.max(0,R.shake-dt);R.scoop=Math.max(0,R.scoop-dt);
  for(const s of R.snd)s.t-=dt;R.snd=R.snd.filter(s=>s.t>0);
  for(const f of R.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=260*dt;}R.fx=R.fx.filter(f=>f.t<f.life);
  if(R.over){R.overT-=dt;if(R.overT<=0&&!R.shown){R.shown=true;fadeTo(()=>showResult());}return;}
  R.cric-=dt;if(R.cric<=0){sfx.cricket();R.cric=rnd(.35,1.4);}
  if(R.sleep){const s=R.sleep;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.x<0||s.x>740){s.vx*=-1;s.x=clamp(s.x,0,740);s.h+=47;}if(s.y<0||s.y>400){s.vy*=-1;s.y=clamp(s.y,0,400);s.h+=47;}}
  // move
  let moving=false;
  if(!R.sleep&&R.scoop<=0){const mv=getMove();if(mv.m>.12){const sp=105*Math.min(1,mv.m*1.2),nx=p.x+mv.x/mv.m*sp*dt,ny=p.y+mv.y/mv.m*sp*dt;
    if(!wkBlock(R,nx,p.y))p.x=nx;if(!wkBlock(R,p.x,ny))p.y=ny;if(Math.abs(mv.x)>.15)p.face=sgn(mv.x);moving=true;p.walkT+=dt;}}
  p.moving=moving;
  R.cam.x=clamp(p.x-W/2,0,R.WK-W);
  // look-around checkpoints
  if(R.phase==='look'&&!R.looked){L.look.forEach((q,i)=>{if(!R.lookSet[i]&&Math.hypot(p.x-q.x,p.y-q.y)<60){R.lookSet[i]=1;sfx.good();wtoast(`ดูรอบๆ ${Object.keys(R.lookSet).length}/4`,1.8);}});
    if(Object.keys(R.lookSet).length>=4){R.looked=true;wtoast('ดูรอบๆ ครบแล้ว กลับไปที่ขั้นบันไดเมรุ แล้วกดมือเพื่อรายงาน',5);}}
  if(R.phase!=='night'){R.san=Math.min(100,R.san+.3*dt);return wkVein(R);}
  // clock
  const rate=R.sleep?(R.lightOn?4:7)*(R.drowsy>0?1.1:1):1.2;R.clock+=rate*dt;if(R.drowsy>0&&R.sleep)R.drowsy-=rate*dt;
  R.evT-=rate*dt;if(R.evT<=0){wkEvent();R.evT=rnd(35,65);}
  // sanity
  let drain=0;const lm=(R.lightOn?.75:1.5)*(R.lamp?.6:1);
  for(const g of R.gs){g.t+=dt;
    if(g.type==='kop'){drain+=2.1*lm;if(!R.sleep&&Math.hypot(g.x-p.x,g.y-p.y)<48){g.gone=true;sfx.good();wtoast('ไล่ผีขอส่วนบุญไปแล้ว สาธุ',2.5);for(let i=0;i<12;i++)R.fx.push({x:g.x,y:g.y-30,vx:rnd(-60,60),vy:rnd(-110,-10),t:0,life:.7,gold:1});}}
    else if(g.type==='fire'){drain+=2.5*(R.lamp?.7:1);if(R.lightOn)g.gone=true;}
    else if(g.type==='owl'){
      if(g.state==='whisper'){g.wt-=dt;if(g.wt<=0){g.wt=3;wkSnd('ซู่... ซ่า... (กระซิบ)',g.x,g.y,330);wtoast('เสียงกระซิบ'+wkDirText(R,g)+'... อย่าจ้องหน้าหรือเข้าใกล้มัน',3);}
        const d=Math.hypot(g.x-p.x,g.y-p.y);
        if(!R.sleep&&(d<110||(d<340&&sgn(g.x-p.x)===p.face&&Math.abs(g.y-p.y)<110))){g.stare+=dt;if(d<110||g.stare>.7){g.state='rush';g.rt=.45;g.sx=g.x;g.sy=g.y;sfx.whoosh();}}else g.stare=Math.max(0,g.stare-dt);
        g.life-=dt;if(g.life<=0)g.gone=true;}
      else{g.rt-=dt;const u=clamp(1-g.rt/.45,0,1);g.x=g.sx+(p.x-g.sx)*u;g.y=g.sy+(p.y-g.sy)*u;if(g.rt<=0){R.san-=25;R.flash=.7;sfx.growl();say('อ๊ะ!!',1.4);g.gone=true;}}}
  }
  R.gs=R.gs.filter(g=>!g.gone);
  if(R.corpse){const c=R.corpse;c.t-=dt;if(c.t<=0){c.n++;c.t=4.5;R.san-=10;R.shake=.5;sfx.thud();wkSnd('ก๊อก!! ก๊อก!!',L.coffin.x+L.coffin.w/2,L.coffin.y,180);wtoast('เสียงจากโลงศพ! สติ -10%',2.2);if(c.n>=5)R.corpse=null;}}
  let reg=.3;if(R.lamp)reg+=.7;if(R.hug)reg+=1.1;if(R.sleep)reg+=.9;
  R.san=Math.min(100,R.san+reg*dt-drain*dt);
  if(R.hug&&R.san<40){R.teddyT-=dt;if(R.teddyT<=0){R.teddyT=11;say(pick(['หมีน้อย... เธอยังอยู่ใช่ไหม','ไม่เป็นไรนะ... หมีน้อยอยู่ตรงนี้','ฉันไม่กลัวหรอก... หมีน้อยก็ไม่กลัวใช่ไหม']),3);}}
  wkVein(R);
  if(R.san<=0){R.san=0;R.over=true;R.dead=true;R.overT=1.6;R.sleep=null;sfx.die();R.why='สติหมด ตายคาที่ในคืนเฝ้าศพ';}
  else if(R.clock>=R.job.end){R.over=true;R.win=true;R.overT=1.4;R.sleep=null;sfx.good();}
}

  const s=L.sw;wkBox(c,s.x-12,s.y-14,s.x+12,s.y+16,'#d8d4c0');wkBox(c,s.x-5,s.y+(R.lightOn?-9:1),s.x+5,s.y+(R.lightOn?1:11),R.lightOn?'#ffd35a':'#6a6a6a');wkLbl(c,'สวิตช์ไฟ '+(R.lightOn?'(เปิด)':'(ปิด)'),s.x,s.y+34);
  // broom
  const m=L.broom;ol(c,2.2);c.beginPath();c.moveTo(m.x-26,m.y+26);c.lineTo(m.x+14,m.y-34);c.stroke();poly(c,[[m.x+8,m.y-26],[m.x+26,m.y-18],[m.x+34,m.y-44],[m.x+16,m.y-52]],'#c9a45a');wkLbl(c,'ไม้กวาด',m.x,m.y+44);
}
function drawWakeGhost(g,R){
  const c=ctx,t=S.t;c.save();
  if(g.type==='kop'){c.globalAlpha=.9;ol(c,2);c.fillStyle='#050505';c.beginPath();c.ellipse(g.x,g.y-20+Math.sin(t*2)*2,15,34,0,0,7);c.fill();c.beginPath();c.arc(g.x,g.y-62+Math.sin(t*2)*2,13,0,7);c.fill();c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.arc(g.x-4,g.y-64,2,0,7);c.arc(g.x+5,g.y-64,2,0,7);c.fill();c.fillStyle='#050505';c.beginPath();c.moveTo(g.x-12,g.y-34);c.quadraticCurveTo(g.x-34,g.y-18,g.x-28,g.y);c.lineTo(g.x-20,g.y-6);c.closePath();c.fill();}
  else if(g.type==='fire'){c.globalCompositeOperation='lighter';glow(c,g.x,g.y-28,90,'255,140,40',.55);c.globalCompositeOperation='source-over';const fl=1+.15*Math.sin(t*14+g.x);ol(c,2);c.beginPath();c.moveTo(g.x,g.y-70*fl);c.bezierCurveTo(g.x+26,g.y-34,g.x+20,g.y,g.x,g.y);c.bezierCurveTo(g.x-20,g.y,g.x-26,g.y-34,g.x,g.y-70*fl);c.fillStyle='#ff8a22';c.fill();c.stroke();c.beginPath();c.moveTo(g.x,g.y-44*fl);c.bezierCurveTo(g.x+12,g.y-22,g.x+9,g.y-2,g.x,g.y-2);c.bezierCurveTo(g.x-9,g.y-2,g.x-12,g.y-22,g.x,g.y-44*fl);c.fillStyle='#ffe27a';c.fill();}
  else if(g.type==='owl'){c.translate(g.x,g.y);c.scale(.8,.8);drawHuntGhost(c,'onn',0,0,t,{face:g.x<R.p.x?1:-1,alpha:1});ol(c,2);poly(c,[[-20,-52],[20,-52],[24,-6],[-24,-6]],'#0a0a0e');}
  c.restore();
}
function drawWakeItems(R){
  const c=ctx,p=R.p;
  if(R.hug){c.save();ol(c,2);ell(c,p.x+p.face*16,p.y-24,9,9,'#a06a3a');ell(c,p.x+p.face*10,p.y-31,3.5,3.5,'#a06a3a');ell(c,p.x+p.face*22,p.y-31,3.5,3.5,'#a06a3a');c.restore();}

}

  c.save();c.translate(x,y);c.scale(s,s);ol(c,2.2);
  if(k==='lamp'){poly(c,[[-8,-6],[8,-6],[11,12],[-11,12]],'#ffd35a');poly(c,[[-6,-14],[6,-14],[8,-6],[-8,-6]],'#8a5a2c');}
  else if(k==='bear'){ell(c,-10,-9,5,5,'#a06a3a');ell(c,10,-9,5,5,'#a06a3a');ell(c,0,-2,13,12,'#a06a3a');ell(c,0,3,6,5,'#e0b37a');ell(c,-4,-4,1.6,1.6,INK,false);ell(c,4,-4,1.6,1.6,INK,false);}
  else{c.save();c.rotate(-.6);poly(c,[[-14,-5],[0,-5],[0,5],[-14,5]],'#fff');poly(c,[[0,-5],[14,-5],[14,5],[0,5]],'#4a8ad8');c.restore();}
  c.restore();
}
function renderWake(t){
  const R=S.run,p=R.p,c=ctx,cam=R.cam;
  c.fillStyle='#04061a';c.fillRect(0,0,W,H);
  c.save();c.translate(-Math.round(cam.x),0);
  drawWakeScene(R);
  // prompt ring
  const L=R.L;let tgt=null,bd=1e9;
  const POI=[[L.jar.x,L.jar.y,80],[L.sw.x,L.sw.y+20,64],[L.broom.x,L.broom.y,64]];
  for(const[x,y,r]of POI){const d=Math.hypot(p.x-x,p.y-y);if(d<r&&d<bd){bd=d;tgt=[x,y];}}
  if(tgt&&!R.sleep){c.strokeStyle=`rgba(255,226,122,${.5+.3*Math.sin(t*8)})`;c.lineWidth=3;c.beginPath();c.arc(tgt[0],tgt[1],26,0,7);c.stroke();}
  const list=[];
  for(const g of R.gs)list.push([g.y,()=>drawWakeGhost(g,R)]);
  if(!R.sleep)list.push([p.y,()=>{
    c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(p.x,p.y+2,14,5,0,0,7);c.fill();
    drawChar(c,S.char,p.x,p.y,{face:p.face,s:.05,pdx:p.pdx,pdy:p.pdy,pr:R.san<40?1.3:1,mouth:R.san<40?'open':'frown',sad:R.san<35,wob:p.moving?Math.sin(p.walkT*8)*.07:0,bob:p.moving?Math.abs(Math.sin(p.walkT*6))*3:0,closed:(t%4)<.12});
    drawWakeItems(R);}]);
  list.sort((a,b)=>a[0]-b[0]);for(const it of list)it[1]();
  for(const f of R.fx){c.globalAlpha=1-f.t/f.life;c.fillStyle=f.gold?'#ffe27a':'#9fd6ff';c.fillRect(f.x,f.y,4,4);}c.globalAlpha=1;
  for(const s of R.snd){if(R.sleep)continue;c.save();c.globalAlpha=Math.min(1,s.t);c.fillStyle='#fff';c.strokeStyle='#000';c.lineWidth=4;c.font=`italic 20px ${FONT}`;c.textAlign='center';c.strokeText(s.text,s.x,s.y-60-(2.4-s.t)*14);c.fillText(s.text,s.x,s.y-60-(2.4-s.t)*14);c.restore();}
  c.restore();
  // darkness
  const dark=(!R.lightOn)||(R.crem&&p.x<1130);
  if(dark){dctx.setTransform(K,0,0,K,0,0);dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,W,H);dctx.fillStyle=R.lightOn?'rgba(2,5,16,.78)':'rgba(2,5,16,.88)';dctx.fillRect(0,0,W,H);dctx.globalCompositeOperation='destination-out';
    const Lh=(x,y,r,a)=>{const sx=x-cam.x;if(sx<-r||sx>W+r)return;const g=dctx.createRadialGradient(sx,y,r*.12,sx,y,r);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');dctx.fillStyle=g;dctx.fillRect(sx-r,y-r,r*2,r*2);};
    Lh(p.x,p.y-30,R.lamp?300:130,.96);Lh(L.coffin.x-16,L.coffin.y+L.coffin.h+10,90,.6);Lh(L.coffin.x+L.coffin.w+16,L.coffin.y+L.coffin.h+10,90,.6);
    for(const g of R.gs)if(g.type==='fire')Lh(g.x,g.y-30,110,.8);
    dctx.globalCompositeOperation='source-over';c.drawImage(dk,0,0,W,H);}
  if(R.vein>.02)drawVeins(R);
  if(R.flash>0){c.fillStyle=`rgba(255,255,255,${R.flash*.6})`;c.fillRect(0,0,W,H);}
  // say bubble
  if(S.say&&!R.sleep){bubble(c,p.x-cam.x,p.y-80,S.say.text,S.say.shown);}
  drawWakeHUD(R);
  if(R.sleep)drawWakeSleep(R);
}
function drawWakeSleep(R){
  const c=ctx,s=R.sleep;c.fillStyle='#000';c.fillRect(0,0,W,H);
  c.save();c.font=`72px ${FONT}`;c.textAlign='left';c.fillStyle=`hsl(${s.h%360},80%,65%)`;c.fillText(fmtT(R.clock),s.x,s.y+90);c.font=`16px ${FONT}`;c.fillStyle='rgba(255,255,255,.55)';c.fillText('กำลังหลับ... เวลาเดินไปเรื่อยๆ',s.x+4,s.y+116);c.restore();
  for(const q of R.snd){c.save();c.globalAlpha=Math.min(1,q.t)*.9;c.fillStyle='#fff';c.font=`italic 26px ${FONT}`;c.textAlign='center';c.fillText(q.text,q.rx,q.ry);c.restore();}
  c.fillStyle='rgba(255,255,255,.4)';c.font=`15px ${FONT}`;c.textAlign='center';c.fillText('แตะหน้าจอเพื่อตื่น',W/2,H-24);
  bar(14,12,170,14,R.san/100,R.san<35?'#d0507a':'#7ab4ff','สติ');
}
function drawWakeHUD(R){
  const c=ctx,p=R.p;
  bar(14,12,170,14,R.san/100,R.san<35?'#d0507a':'#7ab4ff','สติ');
  c.save();c.textAlign='center';c.textBaseline='middle';ol(c,2);rr(c,W/2-170,8,340,50,8);c.fillStyle='rgba(8,10,20,.72)';c.fill();c.stroke();
  c.fillStyle='#ffe27a';c.font=`20px ${FONT}`;c.fillText(fmtT(R.clock)+' → '+fmtT(R.job.end),W/2,24);
  const task=R.phase==='bath'?`อาบน้ำ: ตักน้ำจากโอ่งรดตัว ${R.bath}/5`:R.phase==='look'?(R.looked?'กลับไปรายงานที่ขั้นบันไดเมรุ':`เดินดูรอบๆ เมรุ ${Object.keys(R.lookSet).length}/4`):'เฝ้าศพให้ถึงเช้า รักษาสติไว้';
  c.fillStyle='#f3ecd9';c.font=`14px ${FONT}`;c.fillText(task,W/2,45);c.restore();
  if(R.toast){c.save();c.textAlign='center';c.textBaseline='middle';ol(c,2);c.font=`16px ${FONT}`;const w=Math.min(700,c.measureText(R.toast.text).width+30);rr(c,W/2-w/2,66,w,32,8);c.fillStyle='rgba(8,10,20,.75)';c.fill();c.stroke();c.fillStyle='#f3ecd9';c.fillText(R.toast.text,W/2,82);c.restore();}
  if(R.drowsy>0){c.save();c.fillStyle='#b9a0ff';c.font=`14px ${FONT}`;c.fillText('ง่วง (นอนเร็ว +10%)',14,76);c.restore();}
  c.save();c.strokeStyle='rgba(243,236,217,.5)';c.lineWidth=3;c.fillStyle='rgba(243,236,217,.08)';c.beginPath();c.arc(JOY.x,JOY.y,JOY.r,0,7);c.fill();c.stroke();
  c.fillStyle='rgba(243,236,217,.45)';c.beginPath();c.arc(JOY.x+In.joy.x*JOY.r,JOY.y+In.joy.y*JOY.r,26,0,7);c.fill();c.stroke();c.restore();
  drawHand(BTN.hand,true);const k=p.carry[p.sel];circBtn(BTN.use,k==='lamp'?(R.lamp?'ดับ':'จุด'):k==='bear'?(R.hug?'วาง':'กอด'):'กิน',(k==='lamp'&&R.lamp)||(k==='bear'&&R.hug),0,1);
  const nm={lamp:'โคมไฟ',bear:'ตุ๊กตาหมี',pill:'ยาคลายฯ'};
  for(let i=0;i<3;i++){const b=SLOT(i),kk=p.carry[i];c.save();ol(c,2.6);rr(c,b.x-b.r,b.y-b.r,b.r*2,b.r*2,10);c.fillStyle=p.sel===i?'rgba(255,226,122,.92)':'rgba(243,236,217,.85)';c.fill();c.stroke();
    drawWakeIcon(c,kk,b.x,b.y-4,1.5);c.fillStyle=INK;c.font=`11px ${FONT}`;c.textAlign='center';c.fillText(nm[kk]+(kk==='pill'?' x'+R.pills:''),b.x,b.y+b.r-5);
    c.fillStyle='rgba(60,60,60,.8)';c.textAlign='left';c.fillText(i+1,b.x-b.r+5,b.y-b.r+12);c.restore();}
}
function drawIntroWake(j,t){
  const a=(s)=>clamp((t-s)*2.2,0,1);ctx.textAlign='center';
  ctx.globalAlpha=a(.2);ctx.fillStyle='#c9c2ae';ctx.font=`22px ${FONT}`;ctx.fillText(`${j.place} · ของ${j.owner}`,W/2,160);
  ctx.globalAlpha=a(.9);ctx.save();ctx.translate(W/2,255);ctx.rotate(-.03);ctx.font=`96px ${FONT}`;ctx.lineWidth=10;ctx.strokeStyle='#000';ctx.strokeText('เฝ้าศพ',0,0);ctx.fillStyle='#ffb347';ctx.fillText('เฝ้าศพ',0,0);ctx.restore();
  ctx.globalAlpha=a(1.7);ctx.fillStyle='#f3ecd9';ctx.font=`26px ${FONT}`;ctx.fillText(`${fmtT(j.start)} ถึง ${fmtT(j.end)}  ·  สำเร็จ ฿ ${j.pay.toLocaleString()}  ·  แพ้ ฿ 40`,W/2,320);
  ctx.fillStyle='#9fd6c8';ctx.font=`18px ${FONT}`;ctx.fillText('อาบน้ำ · ดูรอบๆ · นอนข้ามเวลา · รักษาสติให้อยู่รอดถึงเช้า',W/2,356);
  ctx.globalAlpha=a(3.2)*(.5+.5*Math.sin(S.t*5));ctx.fillStyle='#aaa';ctx.font=`16px ${FONT}`;ctx.fillText('แตะเพื่อไปต่อ',W/2,470);ctx.globalAlpha=1;
}
function wakeResult(){
  const R=S.run,j=R.job;const earn=R.win?j.pay:40;S.money+=earn;save();S.mode='result';
  $('result').innerHTML=R.win
   ?`<div class="rc-head">เช้าแล้ว!</div><div class="rc-sub">ผู้ว่าจ้าง ${j.owner} · ${j.place}</div><p class="rc-story">เฝ้าศพครบตามเวลา ${fmtT(j.start)} – ${fmtT(j.end)} สติเหลือ ${Math.round(R.san)}%</p><div class="rc-total"><span>ค่าจ้างเต็ม</span><b>฿ ${earn.toLocaleString()}</b></div><div class="rc-btns"><button id="r-ok" class="go">กลับเถียงนา</button></div>`
   :`<div class="rc-head">สติแตกจนสิ้นใจ</div><div class="rc-sub">${R.why||''}</div><p class="rc-story">เฝ้าไม่ครบคืน ผู้ว่าจ้างให้ค่าเสียเวลาเล็กน้อย</p><div class="rc-total"><span>ได้รับ</span><b>฿ ${earn}</b></div><div class="rc-btns"><button id="r-ok" class="go">กลับเถียงนา</button></div>`;
  if(earn>0)sfx.coin();syncUI();
}

/* ============ MAIN LOOP ============ */
function update(dt){
  // fade
  const f=S.fade;
  if(f.dir===1){f.a+=dt*3.2;if(f.a>=1){f.a=1;f.dir=-1;const cb=f.cb;f.cb=null;if(cb)cb();}}
  else if(f.dir===-1){f.a-=dt*3.2;if(f.a<=0){f.a=0;f.dir=0;}}
  // say
  if(S.say){const s=S.say;s.age+=dt;const n=Math.min(s.text.length,Math.floor(s.age*(S.char==='siang'?15:22)));while(s.shown<n){s.shown++;const ch=s.text[s.shown-1];if(ch!==' '&&s.shown%2===0)sfx.blip();}if(s.age>s.dur+.8)S.say=null;}
  if(S.mode==='hut'){
    const h=S.hut;
    if(h.state==='wait'&&!S.panel){h.timer-=dt;if(h.timer<=0){h.state='ring';h.job=makeJob();h.ringT=0;syncUI();say('โทรศัพท์ดัง! อย่าให้เป็นผีโทรมานะ',2.6);}}
    else if(h.state==='ring'){h.ringT-=dt;if(h.ringT<=0){sfx.ring();h.ringT=1.5;}}
    h.cric-=dt;if(h.cric<=0){sfx.cricket();h.cric=rnd(.5,1.6);}
    if(S.panel==='book')drawBookArt(S.t);if(S.panel==='shop')drawBeaver(S.t);
  }
  if(S.mode==='board'){const h=S.hut;h.cric-=dt;if(h.cric<=0){sfx.cricket();h.cric=rnd(.5,1.6);}}
  if(S.mode==='intro'&&S.intro){S.intro.t+=dt;if((S.intro.t>5.2||S.intro.skip)&&!S.fade.dir){S.intro.t=-999;S.intro.skip=false;fadeTo(()=>startPlay());}}
  if(S.mode==='play'&&S.run&&!S.panel)updatePlay(dt);
}
function render(){
  ctx.setTransform(K,0,0,K,0,0);ctx.clearRect(0,0,W,H);ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const t=S.t;
  if(S.mode==='hut'||S.mode==='splash'||S.mode==='result'&&!S.run)drawHut(t);
  else if(S.mode==='board')drawBoard(t);
  else if(S.mode==='intro'){if(S.intro&&S.intro.t>-900)drawIntro();else{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}}
  else if(S.mode==='play'&&S.run)renderPlay(t);
  else if(S.mode==='result'&&S.run){renderPlay(t);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);}
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
  drawTex();
  if(S.fade.a>0){ctx.fillStyle=`rgba(0,0,0,${S.fade.a})`;ctx.fillRect(0,0,W,H);}
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;S.t+=dt;update(dt);render();requestAnimationFrame(frame);}
syncUI();requestAnimationFrame(frame);
if(/dbg/.test(location.hash))window.__nk={S,get R(){return S.run;},HG};
})();
</script>
